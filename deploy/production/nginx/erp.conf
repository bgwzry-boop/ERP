limit_req_zone $binary_remote_addr zone=miniapp_integration_per_ip:10m rate=60r/m;

server {
    listen 80;
    server_name erp.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.example.invalid;

    ssl_certificate /etc/erp/tls/fullchain.pem;
    ssl_certificate_key /etc/erp/tls/privkey.pem;

    root /opt/erp/current/dist;
    index index.html;
    # Base64 JSON endpoints need room for the 50MB document policy.
    client_max_body_size 75m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status 429;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Miniapp S2S intake/status/reconciliation uses an isolated HMAC service.
    # The installed allowlist must contain only the Miniapp BFF's fixed egress
    # CIDR followed by deny all.
    location ^~ /api/v1/integrations/bagwin/orders {
        include /etc/erp/nginx/miniapp-integration-allowlist.conf;
        limit_req zone=miniapp_integration_per_ip burst=12 nodelay;
        client_max_body_size 2m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Print artwork uses a raw binary endpoint and has a 200MB business limit.
    # Keep a small transport allowance for headers while the API remains authoritative.
    location = /api/attachments/binary {
        client_max_body_size 210m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
