    <text x="265" y="57" class="role-title">管理 / 技术支援</text>
    <text x="265" y="94" class="role-desc">异常判断与系统保障</text>
    <rect x="520" y="40" width="230" height="86" rx="12" class="step-box"/><rect x="800" y="40" width="230" height="86" rx="12" class="step-box"/><rect x="1080" y="40" width="230" height="86" rx="12" class="step-box"/><rect x="1360" y="40" width="230" height="86" rx="12" class="step-box"/><rect x="1640" y="40" width="230" height="86" rx="12" class="step-box"/><rect x="1920" y="40" width="230" height="86" rx="12" class="step-box"/>
    <text x="635" y="76" class="step-text"><tspan x="635">查看异常</tspan><tspan x="635" dy="30">或审核待办</tspan></text>
    <text x="915" y="76" class="step-text"><tspan x="915">判断业务或</tspan><tspan x="915" dy="30">技术问题</tspan></text>
    <text x="1195" y="76" class="step-text"><tspan x="1195">确认影响</tspan><tspan x="1195" dy="30">金额和范围</tspan></text>
