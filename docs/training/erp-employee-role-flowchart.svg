    <text x="265" y="205" class="complete">完成标准：异常有明确结论，系统或设备恢复，并且任务已回到正确岗位继续处理。</text>
    <text x="265" y="252" class="attention">特别注意：管理负责判断、技术负责恢复；两者都不能代替员工填写虚假的生产、库存或交付数据。</text>
