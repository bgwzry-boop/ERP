    AuthLoginRequest:
      type: object
      required:
        - password
      properties:
        loginName:
          type: string
          description: 登录名，seed 骨架示例为 office.a、finance.a 等；导入员工账号发放临时密码后也可使用员工登录名。
        userId:
          type: string
          description: 开发期可直接用 seed 用户 ID 登录。
        password:
          type: string
          format: password

    PrototypeSeedLoginRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: 仅非严格本地原型模式接受的 seed 用户 ID。

    AuthSessionSummary:
      type: object
      required: [accessToken, tokenType, userId, issuedAt, expiresAt, expiresInSeconds]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        userId:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
        jti:
          type: string
          description: 当前 API 进程可用于 logout 吊销的 session 标识。
        sessionVersion:
          type: integer
          description: 导入员工运行期账号的 session 版本；重发或撤销密码后旧版本 token 失效。

    AuthLoginResponse:
      type: object
      required: [session, permissions]
      properties:
        session:
          $ref: "#/components/schemas/AuthSessionSummary"
        permissions:
          $ref: "#/components/schemas/EffectivePermissionsResponse"

    AuthChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 10
          description: 至少 10 位，必须同时包含字母和数字，不能包含空白字符，不能包含登录名、用户 ID 或员工 ID。
        changeNote:
          type: string

    AuthChangePasswordResponse:
      type: object
      required: [changed, user, permissions, operationLogId]
      properties:
        changed:
          type: boolean
        user:
          type: object
          additionalProperties: true
          description: 已脱敏的运行期用户，不包含 passwordHash。
        permissions:
          $ref: "#/components/schemas/EffectivePermissionsResponse"
        employeeAccountReview:
          oneOf:
            - $ref: "#/components/schemas/MasterDataEmployeeAccountReview"
            - type: "null"
        operationLogId:
          type: string

    AuthCurrentSessionResponse:
      type: object
      required: [authenticated, session, permissions]
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/AuthSessionSummary"
        permissions:
          $ref: "#/components/schemas/EffectivePermissionsResponse"

    AuthLogoutResponse:
      type: object
      required: [loggedOut, tokenRevoked]
      properties:
        loggedOut:
          type: boolean
        tokenRevoked:
          type: boolean
          description: 当前 API 进程是否已记录本次 session jti 为吊销。
        sessionUserId:
          type:
            - string
            - "null"
        message:
          type: string

    RecognizeOrderDraftRequest:
      type: object
      required:
        - sourceText
      properties:
        sourceText:
          type: string
          description: 客户原文、电话记录或办公室手工输入文本。
        sourceChannel:
          $ref: "#/components/schemas/SourceChannel"
        sourceMessageId:
          type: string
        sourceSender:
          type: string
        sourceSentAt:
          type: string
          format: date-time
        customerId:
          type: string
        customerNameHint:
          type: string
        attachmentIds:
          type: array
          items:
            type: string
        operatorId:
          type: string
          deprecated: true
          description: 旧客户端兼容字段；服务端忽略该值并使用已认证会话用户。

    OrderDraftRecognitionResponse:
      type: object
      required:
        - draft
        - lines
        - riskHints
        - operationLogId
      properties:
        draft:
          $ref: "#/components/schemas/OrderDraftSummary"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RecognizedOrderDraftLine"
        riskHints:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionRiskHint"
        duplicateCandidates:
          type: array
          items:
            $ref: "#/components/schemas/OriginalOrderSummary"
        operationLogId:
          type: string

    OrderDraftSummary:
      type: object
      required:
        - draftId
        - status
        - sourceText
        - sourceChannel
        - clientRevision
      properties:
        draftId:
          type: string
        status:
          type: string
          enum: [待审核, 待补充信息, 已生成正式订单, 识别错误作废, 疑似重复待处理]
        sourceText:
          type: string
        sourceChannel:
          $ref: "#/components/schemas/SourceChannel"
        sourceMessageId:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        clientRevision:
          type: integer
          minimum: 0
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecognizedOrderDraftLine:
      type: object
      required:
        - draftLineId
        - recognitionStatus
        - missingFields
      properties:
        draftLineId:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        productName:
          type: string
        orderType:
          type: string
          enum: [stock, custom_print, external_print, replenishment, unknown]
        size:
          type: string
        bagColor:
          type: string
