        - name: sourceType
          in: query
          schema:
            type: string
        - name: sourceId
          in: query
          schema:
            type: string
        - name: changeType
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 库存流水分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLedgerEntryListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inventory/reservations:
    post:
      tags: [Inventory]
      summary: 创建成品库存占用
      description: >
        用于正式订单确认、待交付确认、待提货锁定等场景。
        待处理 / 报废 / 未复核库存不能作为正常占用来源。
      operationId: createInventoryReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryReservationRequest"
      responses:
        "200":
          description: 库存占用成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReservationResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inventory/correction-drafts:
    get:
      tags: [Inventory]
      summary: 库存修正确认队列
      description: >
        按状态、库存键或关键词查看库存修正草稿。办公室可用它看到已发起的修正，
        管理账号可进一步调用确认接口让修正生效。
      operationId: listInventoryCorrectionDrafts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [全部, 待确认生效, 已确认生效, 已作废]
            default: 待确认生效
        - name: inventoryItemId
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: 库存修正草稿分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCorrectionDraftListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Inventory]
      summary: 发起库存修正草稿
      description: >
        出库员、办公室或生产主管可发起修正草稿。草稿不直接改库存，
        草稿、待办、待办事件和操作日志在同一事务中写入；操作者取已认证会话，
        请求体里的 operatorId 仅为旧客户端兼容字段，不作为审计身份。
      operationId: createInventoryCorrectionDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryCorrectionDraftRequest"
      responses:
        "200":
          description: 库存修正草稿已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInventoryCorrectionDraftResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inventory/correction-drafts/{correctionDraftId}:
    get:
      tags: [Inventory]
      summary: 查看库存修正详情
      description: >
        从库存流水或待办查看库存修正草稿详情，包含修正前后数量、发起人、
        确认人、关联库存流水和操作日志。查看详情不改变库存数量。
      operationId: getInventoryCorrectionDraftDetail
      parameters:
        - $ref: "#/components/parameters/CorrectionDraftId"
      responses:
        "200":
          description: 库存修正详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCorrectionDraftDetailResponse"
        "404":
          $ref: "#/components/responses/BusinessError"

  /inventory/correction-drafts/{correctionDraftId}/confirm:
    post:
      tags: [Inventory]
      summary: 确认库存修正草稿生效
      description: >
        库存修正只能由有库存调整确认权限的账号确认。确认后写库存流水、
        更新库存和草稿、处理关联待办并写操作日志，以上动作在同一事务中完成。
        操作者取已认证会话，请求体里的 operatorId 不作为审计身份。
      operationId: confirmInventoryCorrectionDraft
      parameters:
        - $ref: "#/components/parameters/CorrectionDraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInventoryCorrectionDraftRequest"
      responses:
        "200":
          description: 库存修正已确认生效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmInventoryCorrectionDraftResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds:
    get:
      tags: [RawMaterials]
      summary: 查询原材料入库单列表
      description: >
        查询原材料厂家随货送货单 / 销货单形成的入库草稿和贴标状态。
        OCR 只作为预填，打印卷标只进入待贴标；只有贴到对应卷/件并扫码/签单后才可用。
      operationId: listRawMaterialInbounds
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 原材料入库单分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}:
    get:
      tags: [RawMaterials]
      summary: 查看原材料入库单详情
      description: >
        查看单张原材料送货单的 OCR / 人工复核、卷/件标签、扫码签单和供应商对账摘要。
      operationId: getRawMaterialInbound
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      responses:
        "200":
          description: 原材料入库单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundDetailResponse"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-inbounds/{rawMaterialInboundId}/review:
    post:
      tags: [RawMaterials]
      summary: 人工复核原材料送货单
      description: >
        办公室核对送货单照片、OCR 字段和实物原标签后，进入待打印卷标状态。
        本动作不让原材料成为可用库存。
      operationId: reviewRawMaterialInbound
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已复核待打印标签
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-inbounds/{rawMaterialInboundId}/print-labels:
    post:
      tags: [RawMaterials]
      summary: 打印原材料卷/件标签
      description: >
        打印一卷一标后状态为已打印待贴标。打印成功不等于贴到实物，
        也不能直接形成可用原材料库存。
      operationId: printRawMaterialInboundLabels
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已打印待贴标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-inbounds/{rawMaterialInboundId}/attach-confirm:
    post:
      tags: [RawMaterials]
      summary: 确认标签已贴到对应卷/件并扫码签单
      description: >
        库房、打包或管理账号确认标签已贴到对应卷/件，并通过手机扫码 / 签单信息回传。
        只有本动作成功的卷/件才成为可用原材料。
      operationId: confirmRawMaterialInboundAttachment
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已贴标入库或部分贴标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-inbounds/{rawMaterialInboundId}/issue-to-machine:
    post:
      tags: [RawMaterials]
      summary: 原材料机边领料
      description: >
        对已贴标扫码且处于可用库存的卷/件执行机边领料，生成 RMI-ISS-* 领料记录。
        V1 第一版支持整卷/整件领料，也支持有重量卷料的拆卷部分领料；拆卷时生成 RMI-SPLIT-* 并保留剩余可用重量。
        生产任务精确匹配、成本分摊和损耗校准仍留到后续流程。
        本动作不生成成品数量，不读取机台计数为合格产量。
      operationId: issueRawMaterialToMachine
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已记录机边领料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/confirm-consumption:
    post:
      tags: [RawMaterials]
      summary: 确认原材料生产消耗
      description: >
        对已机边领用的卷/件确认生产消耗，生成 RMI-CONS-* 消耗记录。
        V1 第一版支持整卷/整件消耗，也支持有重量机边卷料的部分消耗；部分消耗后剩余重量继续留在机边。
        机台计数仅作为动作证据，不生成合格成品数量，不做成本分摊、损耗校准或毛利计算。
      operationId: confirmRawMaterialConsumption
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已记录消耗确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/return-leftover:
    post:
      tags: [RawMaterials]
      summary: 原材料机边余料退回待复核
      description: >
        对已机边领用的卷/件登记余料退回，生成 RMI-RET-* 余料记录。
        退回余料先进入余料待复核，不自动转可用库存，不做成本分摊或毛利计算。
      operationId: returnRawMaterialLeftover
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已记录余料退回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/review-leftover:
    post:
      tags: [RawMaterials]
      summary: 复核原材料余料并转回可用
      description: >
        对已退回且处于余料待复核的卷/件重新称重/复核，生成 RMI-LREV-* 余料复核记录。
        复核通过后才转回可用原材料库存；本动作不做成本分摊、损耗校准或毛利计算。
      operationId: reviewRawMaterialLeftover
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已复核余料并转回可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/generate-cost-draft:
    post:
      tags: [RawMaterials]
      summary: 生成原材料成本分摊草稿
      description: >
        对已确认消耗且已匹配生产任务的原材料生成 RMCA-* 成本分摊草稿。
        V1 第一版只按入库单价快照和已消耗重量 / 件数生成待复核草稿，
        不直接确认订单成本、不写毛利报表、不做损耗校准；未关联生产任务、未确认消耗或缺少单价会被阻断。
      operationId: generateRawMaterialCostDraft
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已生成待复核成本分摊草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/confirm-cost-draft:
    post:
      tags: [RawMaterials]
      summary: 复核确认原材料成本草稿
      description: >
        财务 / 管理复核已生成的 RMCA-* 成本草稿，生成 RMCC-* 成本确认记录，
        并把草稿确认成原材料成本快照。该动作仍不做损耗校准、不更新订单毛利报表、
        不把机台计数当合格产量；无草稿或重复确认会被阻断。
      operationId: confirmRawMaterialCostDraft
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已复核确认成本草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/calibrate-loss:
    post:
      tags: [RawMaterials]
      summary: 校准原材料损耗
      description: >
        财务 / 管理对已确认的 RMCC-* 原材料成本快照补录预计合格产量、实际合格产量或损耗数量，
        生成 RMCL-* 损耗校准记录，并把成本快照推进到待毛利确认状态。该动作只形成
        `loss_calibrated_material_cost_snapshot`，订单毛利报表仍需独立确认；
        不把机台计数当合格产量，也不自动更新最终订单毛利。
      operationId: calibrateRawMaterialLoss
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已校准损耗并等待毛利确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/generate-margin-snapshot:
    post:
      tags: [RawMaterials]
      summary: 生成订单毛利快照
      description: >
        财务 / 管理基于已完成 RMCL-* 损耗校准的原材料成本快照，生成 RMMG-* 订单毛利快照。
        快照记录订单销售金额、已校准原材料成本、毛利额和毛利率，并保持 `margin_snapshot_pending_review`；
        该动作只供财务复核，不自动写客户对账、不确认最终结算，也不把机台计数当合格产量。
      operationId: generateRawMaterialMarginSnapshot
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已生成待复核订单毛利快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/review-margin-snapshot:
    post:
      tags: [RawMaterials]
      summary: 财务复核订单毛利快照
      description: >
        财务 / 管理基于已生成的 RMMG-* 订单毛利快照进行复核，要求订单销售金额已完整补齐。
        成功后生成 RMMR-* 内部毛利报表，把相关成本草稿、成本确认、损耗校准、领料和消耗记录推进到
        `毛利已复核/报表可用`。该动作不自动写客户对账、不登记收款或最终客户结算。
      operationId: reviewRawMaterialMarginSnapshot
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已复核订单毛利快照并生成内部毛利报表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-inbounds/{rawMaterialInboundId}/exception:
    post:
      tags: [RawMaterials]
      summary: 标记原材料入库异常
      description: >
        当送货单照片、OCR 字段、分卷重量、实物标签或供应商信息存在差异时标记异常，
        后续需补照片、补重量或让供应商确认后再处理。
      operationId: createRawMaterialInboundException
      parameters:
        - $ref: "#/components/parameters/RawMaterialInboundId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialInboundActionRequest"
      responses:
        "200":
          description: 已标记异常待确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialInboundActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-supplier-statement-reviews:
    get:
      tags: [RawMaterials]
      summary: 查询原材料供应商月结复核草稿
      description: >
        查询由供应商月结 Excel 预检结果保存的人工复核草稿。
        草稿只用于追踪匹配、候选、未匹配和扣项复核，不写原材料库存、不生成应付、不确认付款。
      operationId: listRawMaterialSupplierStatementReviews
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: reviewStatus
          in: query
          schema:
            type: string
        - name: supplierName
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 月结复核草稿分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierStatementReviewListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
    post:
      tags: [RawMaterials]
      summary: 保存供应商月结预检结果为复核草稿
      description: >
        办公室把 Excel 预检结果保存为人工复核草稿，便于后续查差异和留痕。
        该动作不写原材料库存、不生成应付、不确认付款。
      operationId: createRawMaterialSupplierStatementReviewDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialSupplierStatementReviewCreateRequest"
      responses:
        "200":
          description: 已保存复核草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierStatementReviewResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /raw-material-supplier-statement-reviews/{reviewId}/confirm-review:
    post:
      tags: [RawMaterials]
      summary: 标记供应商月结复核草稿已人工复核
      description: >
        只标记草稿复核结论，仍不写库存、不生成应付、不确认付款。
        后续若要生成成本或应付，必须走单独事务和权限。
      operationId: confirmRawMaterialSupplierStatementReview
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialSupplierStatementReviewConfirmRequest"
      responses:
        "200":
          description: 已标记人工复核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierStatementReviewResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /raw-material-supplier-statement-reviews/{reviewId}/confirm-statement:
    post:
      tags: [RawMaterials]
      summary: 确认供应商月结对账
      description: >
        仅允许已人工复核且一致的供应商月结草稿进入正式对账确认。
        该动作生成对账确认号和待财务付款确认状态，不写原材料库存、不直接付款。
      operationId: confirmRawMaterialSupplierStatement
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialSupplierStatementConfirmRequest"
      responses:
        "200":
          description: 已确认供应商月结对账
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierStatementReviewResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"

  /raw-material-supplier-statement-reviews/{reviewId}/generate-payable:
    post:
      tags: [RawMaterials]
      summary: 生成供应商应付草稿
      description: >
        仅允许财务或管理账号基于已确认对账的供应商月结生成应付草稿。
        该动作会生成 `RMSP-*` 应付草稿号和待财务复核状态，但仍不写原材料库存、不直接确认付款。
      operationId: generateRawMaterialSupplierPayableDraft
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialSupplierPayableDraftGenerateRequest"
      responses:
        "200":
          description: 已生成供应商应付草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierPayableDraftResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"

  /raw-material-supplier-statement-reviews/{reviewId}/confirm-payment:
    post:
      tags: [RawMaterials]
      summary: 确认供应商付款
      description: >
        仅允许财务或管理账号基于已生成的 `RMSP-*` 应付草稿确认供应商付款。
        V1 第一版要求付款金额等于应付草稿金额；该动作只记录 `RMSPAY-*` 付款确认号、金额、付款方式和凭证信息，不写原材料库存、不写客户对账收款。
      operationId: confirmRawMaterialSupplierPayment
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawMaterialSupplierPaymentConfirmRequest"
      responses:
        "200":
          description: 已确认供应商付款
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMaterialSupplierPaymentConfirmResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/BusinessError"

  /inventory/reservations/{reservationId}/release:
    post:
      tags: [Inventory]
      summary: 释放成品库存占用
      description: >
        订单取消、客户拒绝等待、改量、人工释放或占用纠偏时使用。
        释放必须写库存流水和操作日志。
      operationId: releaseInventoryReservation
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseInventoryReservationRequest"
      responses:
        "200":
          description: 库存释放成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseInventoryReservationResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks:
    get:
      tags: [ProductionPacking]
      summary: 查询生产任务列表
      description: >
        供办公室生产 / 打包页和车间手机端任务池使用。列表返回生产任务摘要、
        订单明细、最新报工、后续打包任务和库存键轻量信息；打开任务详情时再读取完整链路。
      operationId: listProductionTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: 支持精确状态，也支持 open / completed 快捷筛选。
        - name: taskType
          in: query
          schema:
            type: string
          description: 制袋、丝印等生产工序。
        - name: visibility
          in: query
          schema:
            type: string
            enum: [workshop_mobile, workshop, all]
          description: 车间手机端传 workshop_mobile 时，只返回已发布排产或同机台跨日未完成任务。
        - name: machineId
          in: query
          schema:
            type: string
          description: 当前机台编号；车间手机端用于限制只看本机台任务。
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 生产任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTaskListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}:
    get:
      tags: [ProductionPacking]
      summary: 读取生产任务详情
      description: >
        用于库存流水、订单明细或生产页定位来源单据。响应包含生产任务、最新报工、
        后续打包任务、库存流水和操作日志。机器计数 / 动作次数只作为凭证展示，
        不参与库存、出库、对账或计费数量。
      operationId: getProductionTaskDetail
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      responses:
        "200":
          description: 生产任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTaskDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /production-schedules/machine-queue:
    get:
      tags: [ProductionPacking]
      summary: 查询机台排产队列
      description: >
        从已发布排产或跨日继续的未完成生产任务派生第一版机台队列，供办公室查看每台机台当前建议执行顺序。
        本接口不代表完整排班、插单、换模或产能排程引擎，也不写库存、不占用库存、不生成打包任务。
      operationId: listProductionMachineQueue
      parameters:
        - name: machineId
          in: query
          schema:
            type: string
          description: 指定机台编号；不传则返回全部机台队列。
        - name: taskType
          in: query
          schema:
            type: string
          description: 制袋、丝印等生产工序。
        - name: status
          in: query
          schema:
            type: string
            default: open
          description: 默认 open，只返回未完成生产任务。
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 机台排产队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionMachineQueueResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-schedules/machine-queue/resequence:
    post:
      tags: [ProductionPacking]
      summary: 调整同机台排产队列顺序
      description: >
        办公室或管理账号对同一机台的当前未完成排产队列进行人工调序，并写入操作日志。
        请求必须提交该机台当前队列的完整 productionTaskId 顺序，避免漏排或跨机台调序。
        本接口只更新队列顺序记录，不写库存、不占用库存、不生成打包任务，也不代表完整排班 / 插单 / 换模 / 产能排程引擎。
        队列记录和日志原子提交；idempotencyKey 重放返回首次结果，陈旧队列快照返回 409。
      operationId: resequenceProductionMachineQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionMachineQueueResequenceRequest"
      responses:
        "200":
          description: 机台队列顺序已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionMachineQueueResequenceResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-schedules/machine-queue/move:
    post:
      tags: [ProductionPacking]
      summary: 移动生产任务到目标机台队列
      description: >
        办公室或管理账号把当前未完成生产任务移动到目标机台，并按目标位置插入队列。
        接口会更新生产任务机台、写入源机台 moved 记录、写入目标机台 active 队列记录和操作日志。
        本接口只调整排产队列，不写库存、不占用库存、不生成打包任务，也不代表完整排班 / 换模 / 产能排程引擎。
        生产任务、源/目标队列和日志原子提交；idempotencyKey 重放返回首次结果，陈旧任务或队列快照返回 409。
      operationId: moveProductionMachineQueueItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionMachineQueueMoveRequest"
      responses:
        "200":
          description: 生产任务已移动到目标机台队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionMachineQueueMoveResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}/publish-schedule:
    post:
      tags: [ProductionPacking]
      summary: 办公室发布生产任务到车间任务池
      description: >
        办公室或管理账号确认排产后，为生产任务写入 publishedScheduleId、机台和已排产状态。
        车间手机端只会看到已发布排产且匹配当前机台的未完成任务；本接口不写入库存、
        不锁定订单库存、不生成打包任务，也不生成报工记录。生产任务、订单行和日志原子提交；
        idempotencyKey 重放返回首次发布结果，陈旧任务或订单行快照返回 409。
      operationId: publishProductionTaskSchedule
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionSchedulePublishRequest"
      responses:
        "200":
          description: 排产已发布，车间任务池可按机台看到该任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionSchedulePublishResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}/report-complete:
    post:
      tags: [ProductionPacking]
      summary: 生产任务合格报工并写入库存占用
      description: >
        车间或办公室确认合格生产数量。只有合格数量会进入成品在库并同步锁定给订单明细；
        机器计数 / 动作次数只作为报工凭证保存，不参与库存、出库、对账或计费数量。
        当机台主数据已存在时，接口会按机台 + 规格 + 日期累加一条 production_report
        产能校准样本；样本数量来自合格报工数量，不来自机器计数。
        外加工印刷服务单不应调用本接口入库。生产任务、订单行、库存、占用、流水、打包任务和日志在同一事务内提交；
        idempotencyKey 相同且请求内容相同时返回首次结果，不会重复入库或占用。
      operationId: reportProductionTaskComplete
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionReportCompleteRequest"
      responses:
        "200":
          description: 生产报工已保存，合格数已入库并锁定给订单明细
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionReportCompleteResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}/daily-progress:
    post:
      tags: [ProductionPacking]
      summary: 记录生产任务跨日当日报数
      description: >
        车间当天结束时记录当日合格数量、异常数量和机器计数，用于次日自动带出昨日完成和剩余数量。
        本接口只沉淀跨日进度，不写入成品库存、不锁定订单库存、不生成打包任务，也不生成机台产能校准样本。
        真正完工入库仍必须调用 report-complete。任务、日报和日志在同一事务内提交，并支持 idempotencyKey 重放。
      operationId: recordProductionTaskDailyProgress
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionDailyProgressRequest"
      responses:
        "200":
          description: 当日报数已保存，任务进入跨日继续或待完工确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionDailyProgressResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}/finished-goods-photo:
    post:
      tags: [ProductionPacking]
      summary: 上传并登记定制印刷成品图
      description: >
        车间为生产任务登记成品图附件。附件必须归属当前生产任务、用途为 finished_goods_photo、
        是有效图片且由当前认证操作人上传。上传后状态为待确认，不进入待通知客户池，
        任务成品图状态和操作日志同一事务保存；操作者取认证会话。接口不写库存、
        不锁定订单库存、不生成打包任务。
      operationId: uploadProductionTaskFinishedGoodsPhoto
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionFinishedGoodsPhotoUploadRequest"
      responses:
        "200":
          description: 成品图已登记，等待办公室复核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionFinishedGoodsPhotoResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /production-tasks/{productionTaskId}/finished-goods-photo-review:
    post:
      tags: [ProductionPacking]
      summary: 复核定制印刷成品图
      description: >
        办公室或管理账号确认成品图。复核通过后生成待通知客户待办；退回则生成成品图需重拍待办。
        任务、待办、待办事件和操作日志同一事务保存，并自动解决已通过重拍的旧待办。
        操作者取认证会话；本接口仍不写库存、不锁定订单库存、不生成打包任务。
      operationId: reviewProductionTaskFinishedGoodsPhoto
      parameters:
        - $ref: "#/components/parameters/ProductionTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionFinishedGoodsPhotoReviewRequest"
      responses:
        "200":
          description: 成品图复核结果已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionFinishedGoodsPhotoResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /packing-tasks:
    get:
      tags: [ProductionPacking]
      summary: 查询打包任务列表
      description: >
        供办公室打包区和车间 / 打包手机端任务池使用。列表返回打包任务摘要、
        订单明细、包裹数、交付状态和库存键轻量信息；打包完成本身仍不扣减库存。
      operationId: listPackingTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: 支持精确状态，也支持 open / completed 快捷筛选。
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 打包任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingTaskListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /packing-tasks/{packingTaskId}:
    get:
      tags: [ProductionPacking]
      summary: 读取打包任务详情
      description: >
        用于库存流水或出库页定位打包来源单据。响应包含打包任务、包裹明细、
        交付状态、库存追踪流水和操作日志。打包完成本身不扣减库存。
      operationId: getPackingTaskDetail
      parameters:
        - $ref: "#/components/parameters/PackingTaskId"
      responses:
        "200":
          description: 打包任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingTaskDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /packing-tasks/{packingTaskId}/complete:
    post:
      tags: [ProductionPacking]
      summary: 打包完成并生成包裹明细
      description: >
        打包完成只确认包裹和下一步交付状态，不扣减成品库存。
        库存扣减仍发生在出库完成或快递 / 快运确认拉走时。接口会写零数量库存追踪流水，
        方便审计“已打包但未交付”的状态。打包任务、包裹、订单行、交付记录、流水和日志在同一事务内提交，
        并支持 idempotencyKey 重放，避免重复生成包裹。
      operationId: completePackingTask
      parameters:
        - $ref: "#/components/parameters/PackingTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePackingTaskRequest"
      responses:
        "200":
          description: 打包任务已完成，包裹明细已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletePackingTaskResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments:
    get:
      tags: [Fulfillment]
      summary: 查询出库 / 交付任务列表
      description: >
        出库交付页列表使用。默认关注今天要交付、未完成和异常优先任务；
        历史完成任务需要显式筛选。
      operationId: listFulfillments
      parameters:
        - name: method
          in: query
          schema:
            $ref: "#/components/schemas/FulfillmentMethod"
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: exceptionOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 出库 / 交付任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/exception:
    post:
      tags: [Fulfillment]
      summary: 上报出库 / 交付异常
      description: >
        出库员不能直接改订单数量、库存总数或对账金额。
        数量不符和无法出库必须生成或复用办公室公共待办。
      operationId: createFulfillmentException
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFulfillmentExceptionRequest"
      responses:
        "200":
          description: 异常已记录，并返回待处理状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentExceptionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/print:
    post:
      tags: [Fulfillment]
      summary: 打印 / 预览出库交付单据或标签
      description: >
        出库页的场景快捷接口。底层仍应创建打印记录；快递 / 快运标签打印后
        可进入待确认拉走状态，价格字段按模板规则隐藏；自提 / 送货针式单据显示价格快照。
      operationId: printFulfillmentDocument
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintFulfillmentRequest"
      responses:
        "200":
          description: 单据 / 标签已预览或打印
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintFulfillmentResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/dispatch:
    post:
      tags: [Fulfillment]
      summary: 办公室创建或编辑司机派单
      description: >
        仅适用于送货交付记录。办公室或管理账号设置司机、路线日期、趟号、
        站点顺序和计划发车时间；该动作不会自动确认装车或完成送货。
      operationId: upsertFulfillmentDriverDispatch
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillmentDispatchRequest"
      responses:
        "200":
          description: 司机派单已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentDispatchResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/complete:
    post:
      tags: [Fulfillment]
      summary: 完成自提 / 送货 / 普通出库交付
      description: >
        用于自提和送货等明确交付动作。出库员或办公室不能直接改订单数量，
        实际数量异常应先走出库异常接口。
      operationId: completeFulfillment
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFulfillmentRequest"
      responses:
        "200":
          description: 交付已完成，可能进入对账候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentActionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/prepared:
    post:
      tags: [Fulfillment]
      summary: 标记出库任务已备货
      description: 只更新备货状态和审计记录，不扣减库存、不释放占用、不进入对账候选。
      operationId: markFulfillmentPrepared
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillmentId]
              properties:
                fulfillmentId:
                  type: string
                operatorId:
                  type: string
                  deprecated: true
                  description: 旧客户端兼容字段；服务端忽略该值并使用已认证会话用户。
                preparedAt:
                  type: string
                  format: date-time
                remark:
                  type: string
      responses:
        "200":
          description: 已记录备货状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/pickup-confirm:
    post:
      tags: [Fulfillment]
      summary: 确认快递 / 快运已拉走
      description: >
        快递快运必须先打印标签或进入待确认拉走状态，再确认已拉走。
        确认后才进入已交付和对账候选。
      operationId: confirmFulfillmentPickup
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFulfillmentPickupRequest"
      responses:
        "200":
          description: 快递 / 快运已确认拉走
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentActionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/cancel:
    post:
      tags: [Fulfillment]
      summary: 取消未交付的出库 / 交付任务
      description: >
        用于办公室或管理账号撤销尚未交付的出库任务。接口不关闭订单明细；
        如果该明细存在仍生效的库存占用，则同事务释放占用、写库存流水和操作日志。
      operationId: cancelFulfillment
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelFulfillmentRequest"
      responses:
        "200":
          description: 出库任务已取消，占用库存已按规则释放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFulfillmentResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /fulfillments/{fulfillmentId}/delivery-evidence-review:
    post:
      tags: [Fulfillment]
      summary: 办公室复核司机送达证据
      description: >
        只适用于送货交付记录。办公室或管理账号检查水印照片、定位、签收照片和纸质回单状态后，
        可标记已复核，或退回需重拍并生成照片待重拍公共待办。司机账号不能复核自己的送达证据。
      operationId: reviewDeliveryEvidence
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDeliveryEvidenceRequest"
      responses:
        "200":
          description: 送达证据复核结果已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDeliveryEvidenceResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /driver/delivery-tasks:
    get:
      tags: [Driver]
      summary: 查询司机手机端送货任务
      description: >
        只返回当前认证司机已有有效派单的送货任务；driverId 查询参数仅保留旧客户端兼容，
        不能覆盖认证身份。司机端只能查看任务、确认装车、提交送达凭证或上报异常，
        不能修改订单、价格、库存主数据或对账。
      operationId: listDriverDeliveryTasks
      parameters:
        - name: driverId
          in: query
          deprecated: true
          description: 旧客户端兼容参数；服务端忽略该值并使用认证会话司机。
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DriverDeliveryStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 司机送货任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDeliveryTaskListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /driver/v1-readiness:
    get:
      tags: [Driver]
      summary: 查询 V1 司机端真机上线就绪门禁
      description: >
        汇总司机送货任务读取、最新司机手机现场验收记录、6 项现场检查、原生扫码桥接、
        原生导航桥接和纸质包裹标签原生扫码样本。该接口只读，不修改送货状态、
        不触发相机、定位、扫码 SDK 或地图 App。
      operationId: getDriverV1Readiness
      responses:
        "200":
          description: V1 司机端真机上线就绪汇总
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverV1ReadinessResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /driver/delivery-tasks/{fulfillmentId}:
    get:
      tags: [Driver]
      summary: 查询司机送货任务详情
      description: 仅当前认证司机有效派单范围内的任务可见；其他司机或未派单任务按不存在处理。
      operationId: getDriverDeliveryTask
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      responses:
        "200":
          description: 司机送货任务详情
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/DriverDeliveryTask"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /driver/delivery-tasks/{fulfillmentId}/load-confirm:
    post:
      tags: [Driver]
      summary: 司机确认已装车
      description: 仅任务当前指派司机可执行；所有任务包裹完成核对后才能进入配送中。
      operationId: confirmDriverDeliveryLoaded
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDeliveryLoadConfirmRequest"
      responses:
        "200":
          description: 装车确认已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDeliveryActionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /driver/delivery-tasks/{fulfillmentId}/device-field-tests:
    post:
      tags: [Driver]
      summary: 记录司机现场设备验收结果
      description: >
        记录真实司机手机 / 浏览器的现场验收结果，包括相机权限、水印拍照、
        包裹扫码、定位读取、上传兜底和外部导航。该接口写入操作日志，
        但不自动触发相机、定位、文件选择或外部导航权限动作。记录只能写入
        当前认证司机的有效派单任务，driverId / operatorId 请求字段不作为身份来源。
      operationId: recordDriverDeviceFieldTest
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDeviceFieldTestRecord"
      responses:
        "200":
          description: 现场设备验收结果已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDeviceFieldTestResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /driver/delivery-tasks/{fulfillmentId}/complete:
    post:
      tags: [Driver]
      summary: 司机提交送达和回单凭证
      description: >
        首次完成送货必须先确认装车并提交水印照片凭证，且仅当前指派司机可执行。
        水印照片必须是当前交付名下、用途为 delivery_watermark_photo、由当前认证司机上传的正式附件；
        水印操作人固定为认证司机，不能由请求体覆盖。可选签收照片同样必须归属当前交付、用途为
        signature_photo 且由当前认证司机上传。若办公室已将送达证据退回为需重拍，
        同一接口可用于司机补拍后重新提交证据；补拍提交只更新证据并回到待复核，
        不重复扣减库存。签收照片、收货人、纸质联状态和备注可选补充。
      operationId: completeDriverDeliveryTask
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDeliveryCompleteRequest"
      responses:
        "200":
          description: 送货已完成，进入回单复核 / 对账候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDeliveryCompleteResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /driver/delivery-tasks/{fulfillmentId}/exception:
    post:
      tags: [Driver]
      summary: 司机上报装车或送货异常
      operationId: reportDriverDeliveryException
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDeliveryExceptionRequest"
      responses:
        "200":
          description: 异常已记录并回到办公室公共待办
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDeliveryExceptionResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/customers:
    get:
      tags: [Statements]
      summary: 查询客户维度对账列表
      description: >
        对账 / 收款页左侧客户列表。默认显示本期待对账、有欠款 / 差额、
        有收款待确认的客户，已结清历史需要显式筛选。
      operationId: listStatementCustomers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [default_pending, current_period, debt_or_variance, payment_pending, settled, all]
        - name: keyword
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 客户维度对账列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementCustomerListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}:
    get:
      tags: [Statements]
      summary: 查询对账单详情
      description: >
        返回对账 / 收款页右侧详情，包括客户摘要、本期明细、合计、调整、
        实收、差额处理、附件和操作日志。
      operationId: getStatementDetail
      parameters:
        - $ref: "#/components/parameters/StatementId"
      responses:
        "200":
          description: 对账单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetailResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /statements/{statementId}/preview:
    post:
      tags: [Statements]
      summary: 生成对账单预览 / Excel 导出文件
      description: >
        返回浏览器预览数据，并生成客户发送版 / 内部留档版 Excel XML 文件供下载。
        预览不等于已发送。正式环境使用认证会话作为创建人与审计操作人，并按
        Idempotency-Key 原子保存导出元数据、明细和操作日志。
      operationId: previewStatement
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewStatementRequest"
      responses:
        "200":
          description: 对账单预览数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStatementResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/exports:
    get:
      tags: [Statements]
      summary: 查询对账单导出记录
      description: >
        返回当前对账单已生成的客户发送版 / 内部留档版导出文件元数据，不返回文件内容。
        返回的 downloadToken 可用于历史记录重下同一份归档导出文件。
      operationId: listStatementExports
      parameters:
        - $ref: "#/components/parameters/StatementId"
      responses:
        "200":
          description: 对账单导出记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementExportListResponse"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /statements/{statementId}/exports/{downloadToken}:
    get:
      tags: [Statements]
      summary: 下载对账单导出文件
      description: >
        使用预览接口或导出记录列表返回的 downloadToken 下载实际文件。P0 返回 Excel 可打开的双 sheet `.xlsx` 文件；
        历史记录下载必须读取已归档文件，不应在前端静默重新生成。后续如接入对象存储或模板引擎，保持该下载边界。
      operationId: downloadStatementExport
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/DownloadToken"
      responses:
        "200":
          description: 对账单 Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /statements/{statementId}/mark-sent:
    post:
      tags: [Statements]
      summary: 标记对账单已发送
      description: >
        记录发送渠道、发送对象、发送人和时间。发送记录不自动确认收款。
        正式环境使用认证会话作为发送人，并以幂等事务、资源锁和对账单 revision 防止重复或陈旧写入。
      operationId: markStatementSent
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkStatementSentRequest"
      responses:
        "200":
          description: 对账单已标记发送
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementActionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/send-receipt:
    post:
      tags: [Statements]
      summary: 登记对账发送回执
      description: >
        在已有发送记录上登记客户已送达、已读、已确认或未回复等回执状态。该动作只更新发送归档，不自动确认收款。
        回执人取认证会话，并以发送记录 revision 和 Idempotency-Key 防止重复或陈旧写入。
      operationId: recordStatementSendReceipt
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkStatementSendReceiptRequest"
      responses:
        "200":
          description: 已登记对账发送回执
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementSendReceiptResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/customer-confirmation:
    post:
      tags: [Statements]
      summary: 登记客户确认对账无误
      description: >
        在已有发送记录上登记客户回复“没问题 / 确认”等确认内容。附件必须归属当前对账单、用途为
        statement_customer_confirmation、是有效图片或 PDF，且具有认证上传人；上传人可与当前登记人不同。
        该动作会把发送回执升级为 confirmed，并保留独立客户确认证据记录，但不自动确认收款。
        记录人取认证会话；对账单、发送记录、确认记录和操作日志以幂等事务原子提交。
      operationId: recordStatementCustomerConfirmation
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCustomerConfirmationRequest"
      responses:
        "200":
          description: 已登记客户确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementCustomerConfirmationResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/payments:
    post:
      tags: [Statements]
      summary: 登记实收金额
      description: >
        收款登记和收款确认分权限。少付默认进入差额待确认，不能自动抹零。可选付款附件必须归属
        当前对账单、用途为 payment_screenshot、是有效图片且具有认证上传人；上传人可与当前登记人不同。
      operationId: recordStatementPayment
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordStatementPaymentRequest"
      responses:
        "200":
          description: 收款已登记，可能生成差额待办
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordStatementPaymentResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/variance:
    post:
      tags: [Statements]
      summary: 处理对账 / 收款差额
      description: >
        客户少付不能自动抹掉。必须先记录差额处理结果，再决定确认欠款、
        继续等待收款、重算账单或按权限核销。可选差额附件沿用当前对账单的 payment_screenshot 合同。
      operationId: handleStatementVariance
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandleStatementVarianceRequest"
      responses:
        "200":
          description: 差额处理结果已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleStatementVarianceResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /statements/{statementId}/write-off:
    post:
      tags: [Statements]
      summary: 确认核销 / 结清对账单
      description: >
        核销需要收款确认权限。存在未处理差额、未确认收款、未发送或未生成
        明细时不能直接核销。核销本身不接收附件，证据必须先关联到付款或差额记录。
      operationId: writeOffStatement
      parameters:
        - $ref: "#/components/parameters/StatementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffStatementRequest"
      responses:
        "200":
          description: 对账单核销结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOffStatementResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-records:
    post:
      tags: [Print]
      summary: 创建打印 / 预览 / 重打记录
      description: >
        P0 可先做浏览器预览，但正式系统必须记录模板、批次、打印人、
        打印动作和重打原因。快递快运标签不显示价格。
      operationId: createPrintRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrintRecordRequest"
      responses:
        "200":
          description: 打印记录已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePrintRecordResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-devices:
    get:
      tags: [Print]
      summary: 查询打印设备配置
      description: >
        返回可用于标签、针式单据或普通办公打印的设备参数。
        P0 先保存设备、纸张、DPI、驱动模式和默认单据类型，后续再接真实驱动。
      operationId: listPrintDevices
      parameters:
        - name: documentType
          in: query
          schema:
            type: string
            enum: [express_ltl_label, package_label, outbound_note, pickup_note, delivery_note, outbound_slip, pickup_slip, statement_excel]
        - name: deviceType
          in: query
          schema:
            $ref: "#/components/schemas/PrintDeviceType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PrintDeviceStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 打印设备列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintDeviceListResponse"
    post:
      tags: [Print]
      summary: 保存打印设备参数
      description: >
        办公室或打印权限账号维护设备、纸张、DPI、份数、浓度、速度和驱动模式。
        该接口不直接调用操作系统打印，只保存后续真机打印需要的参数快照。
      operationId: upsertPrintDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPrintDeviceRequest"
      responses:
        "200":
          description: 打印设备已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertPrintDeviceResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-devices/{printDeviceId}/driver-mode:
    post:
      tags: [Print]
      summary: 更新打印设备驱动模式
      description: >
        办公室或有打印权限账号只更新打印设备的 settings.driverMode。
        该接口不会覆盖纸张、DPI、默认单据类型等其它设备参数，也不调用真实打印机。
      operationId: updatePrintDeviceDriverMode
      parameters:
        - name: printDeviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrintDeviceDriverModeRequest"
      responses:
        "200":
          description: 打印设备驱动模式已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePrintDeviceDriverModeResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-devices/{printDeviceId}/field-tests:
    get:
      tags: [Print]
      summary: 查询打印设备现场验收记录
      description: >
        查询某台标签机、针式打印机或办公打印机的现场验收记录。
        该记录用于证明样张、纸张对位、条码扫码、驱动回写等人工或半自动检查已被记录，
        不等同于自动读取打印机硬件状态。
      operationId: listPrinterDeviceFieldTests
      parameters:
        - name: printDeviceId
          in: path
          required: true
          schema:
            type: string
        - name: printJobId
          in: query
          schema:
            type: string
        - name: documentType
          in: query
          schema:
            type: string
        - name: operatorId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 打印设备现场验收记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterDeviceFieldTestListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Print]
      summary: 记录打印设备现场验收结果
      description: >
        记录标签机或针式打印机的现场验收结果，包括样张打印、纸张对位、条码扫码、
        驱动回写、内容清晰度和作废重打链路。该接口只保存验收记录和操作日志，
        不把验收记录自动视为打印成功，也不直接调用系统打印命令。
      operationId: recordPrinterDeviceFieldTest
      parameters:
        - name: printDeviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterDeviceFieldTestRecord"
      responses:
        "200":
          description: 打印设备现场验收结果已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterDeviceFieldTestResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-jobs:
    get:
      tags: [Print]
      summary: 查询打印作业队列
      description: >
        查询已生成的打印执行作业。打印记录表示业务单据/标签版本，
        打印作业表示准备交给设备或驱动的一次执行尝试。
      operationId: listPrintJobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PrintJobStatus"
        - name: targetType
          in: query
          schema:
            type: string
            enum: [fulfillment, package, statement, order_line]
        - name: targetId
          in: query
          schema:
            type: string
        - name: printRecordId
          in: query
          schema:
            type: string
        - name: printDeviceId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 打印作业列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJobListResponse"

  /print-jobs/{printJobId}/status:
    post:
      tags: [Print]
      summary: 回写打印作业状态
      description: >
        供真实打印驱动、设备适配层或办公室人工核对后回写 sent / printed / failed / canceled。
        P0 默认设备为 preview_only，因此该接口先作为后续真机集成边界。
      operationId: updatePrintJobStatus
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrintJobStatusRequest"
      responses:
        "200":
          description: 打印作业状态已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePrintJobStatusResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-jobs/{printJobId}:
    get:
      tags: [Print]
      summary: 查询单个打印作业
      description: >
        按打印作业 ID 查询当前状态，供前端或驱动适配层轮询作业状态。
      operationId: getPrintJob
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 打印作业详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPrintJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /print-driver/config:
    get:
      tags: [Print]
      summary: 查询本地打印驱动适配器配置
      description: >
        返回当前打印适配器的安全配置快照，用于部署检查和本地打印服务诊断。
        响应只暴露是否已配置命令、设备白名单和保护状态，不返回真实系统命令内容。
      operationId: getPrintDriverConfig
      responses:
        "200":
          description: 当前打印驱动适配器配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintDriverConfigResponse"

  /print-driver/spool-diagnostics:
    get:
      tags: [Print]
      summary: 运行打印命令桥 spool 状态回读诊断
      description: >
        写入一条诊断用 spool 状态文件，验证 pending / completed 两种状态能被 ERP 打印适配器回读并清理诊断文件。
        该接口需要打印权限，且只做 non-printing 诊断，不调用系统打印命令、不触发真实物理打印。
      operationId: runPrintDriverSpoolDiagnostics
      responses:
        "200":
          description: 打印命令桥 spool 状态回读诊断结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintDriverSpoolDiagnosticsResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /print-driver/cups-diagnostics:
    get:
      tags: [Print]
      summary: 运行 CUPS 队列状态预检
      description: >
        通过命令桥运行 non-printing CUPS 队列状态检查，例如 lpstat -p。
        该接口需要打印权限，不读取订单 payload、不生成打印文件、不提交真实打印作业，响应不暴露命令路径、参数或 stdout/stderr 内容。
      operationId: runPrintDriverCupsDiagnostics
      responses:
        "200":
          description: CUPS 队列状态预检结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintDriverCupsDiagnosticsResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /print-driver/v1-readiness:
    get:
      tags: [Print]
      summary: 查询 V1 打印上线就绪门禁
      description: >
        汇总系统打印配置、spool 状态回读诊断、non-printing CUPS 队列预检、V1 必需打印设备资料、驱动模式和现场 QA 记录，
        返回当前是否达到 V1 打印上线门禁。该接口不调用真实打印命令、不触发物理打印。
      operationId: getPrintDriverV1Readiness
      responses:
        "200":
          description: V1 打印上线就绪汇总
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintDriverV1ReadinessResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /print-jobs/{printJobId}/dispatch:
    post:
      tags: [Print]
      summary: 派发打印作业到驱动适配器
      description: >
        将 queued / preview_only 打印作业交给当前驱动适配器处理。
        P0 默认 adapter 不会调用真实系统打印机：preview_only 会明确跳过，
        未配置真实驱动的 system_printer 会把作业标记为 failed。
      operationId: dispatchPrintJob
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchPrintJobRequest"
      responses:
        "200":
          description: 打印作业已完成一次派发尝试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchPrintJobResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"

  /print-jobs/status-poll:
    post:
      tags: [Print]
      summary: 批量轮询打印作业驱动状态
      description: >
        供本地打印服务或定时任务批量轮询 queued / sent 作业。调用方必须使用
        具备 print.job.callback 的打印驱动服务账号；轮询到明确状态时会复用
        driver-status 写回规则，operation log 的 operatorId 取鉴权账号。
      operationId: pollPrintJobsStatus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollPrintJobsRequest"
      responses:
        "200":
          description: 打印作业批量轮询完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollPrintJobsResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /print-jobs/{printJobId}/driver-status:
    post:
      tags: [Print]
      summary: 记录打印驱动状态回调
      description: >
        供真实打印驱动回调或轮询任务写回 queued / sent / printed / failed / canceled。
        与办公室人工状态更新分开记录，便于后续区分设备证据和人工处理。
        调用方必须使用具备 print.job.callback 的打印驱动服务账号；operation log
        的 operatorId 取鉴权账号，不取请求体里的自由文本 operatorId。
      operationId: recordPrintJobDriverStatus
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPrintJobDriverStatusRequest"
      responses:
        "200":
          description: 打印驱动状态已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPrintJobDriverStatusResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-jobs/{printJobId}/poll-status:
    post:
      tags: [Print]
      summary: 轮询单个打印作业驱动状态
      description: >
        供本地打印服务或定时任务对单个作业查询驱动 / 系统队列状态。调用方必须使用
        具备 print.job.callback 的打印驱动服务账号；有明确状态时会写入
        driver-status 事件，没有可轮询状态时只返回 pollResult。
      operationId: pollPrintJobStatus
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollPrintJobStatusRequest"
      responses:
        "200":
          description: 打印作业轮询完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollPrintJobStatusResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-jobs/{printJobId}/retry:
    post:
      tags: [Print]
      summary: 从失败作业发起重试
      description: >
        只允许从 failed / canceled 作业创建新的尝试，保留原作业和错误信息。
        新作业会关联 sourcePrintJobId 并递增 attemptNo。
      operationId: retryPrintJob
      parameters:
        - name: printJobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryPrintJobRequest"
      responses:
        "200":
          description: 已创建重试打印作业
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryPrintJobResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"

  /print-batches:
    get:
      tags: [Print]
      summary: 查询批量打印批次记录
      description: >
        查询办公室批量打印确认后形成的批次记录，可按待办 ID 或批次状态过滤。
        P0 用于公共待办详情追溯“本次哪些包裹已打出、哪些待重打”。
      operationId: listPrintBatches
      parameters:
        - name: todoId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PrintBatchStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 打印批次记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintBatchListResponse"
    post:
      tags: [Print]
      summary: 创建批量打印批次记录
      description: >
        批量打印标签后，办公室必须确认全部打出、部分打出、没打出或结果不确定。
        该接口记录批次号、待办、包裹标签、已打 / 待打数量和认证操作人，后续可用于重打追溯。
        请求体中的操作人字段不能覆盖当前认证身份；该人工确认记录不替代可信 spool printed 回读。
      operationId: createPrintBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrintBatchRequest"
      responses:
        "200":
          description: 打印批次记录已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePrintBatchResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /print-records/{printRecordId}/void:
    post:
      tags: [Print]
      summary: 作废已打印单据 / 标签
      description: >
        客户、数量、价格、交付方式等关键信息变化后，旧单据或标签必须作废，
        新单据走重打记录，不能静默覆盖。
      operationId: voidPrintRecord
      parameters:
        - $ref: "#/components/parameters/PrintRecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidPrintRecordRequest"
      responses:
        "200":
          description: 打印记录已作废
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidPrintRecordResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attachments:
    get:
      tags: [Attachments]
      summary: 查询附件摘要
      description: >
        按业务对象、用途和文件类型查询附件摘要。P0 用于从本地 JSON 索引恢复付款截图等附件记录；
        正式环境应由数据库附件表返回。
      operationId: listAttachments
      parameters:
        - name: ownerType
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: purpose
          in: query
          schema:
            type: string
        - name: fileType
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 附件摘要列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "403":
          $ref: "#/components/responses/BusinessError"
    post:
      tags: [Attachments]
      summary: 上传并登记附件
      description: >
        用于印刷图、成品图、付款截图、送货水印照片等。上传后附件进入
        统一附件记录，并通过 ownerType / ownerId / purpose 关联业务对象。
        正式环境把元数据和关联写入 PostgreSQL，把文件写入对象存储；相同
        ownerType / ownerId / purpose / contentDigest 的内容复用已有附件。
        上传人固定为当前认证用户，请求体 uploadedBy 仅为旧客户端兼容且会被忽略。
      operationId: createAttachment
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: 生产业务写入必填；同一请求重试必须复用相同键。
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "200":
          description: 附件已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAttachmentResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/BusinessError"

  /attachments/storage-diagnostics:
    get:
      tags: [Attachments]
      summary: 附件对象存储诊断
      description: >
        用于 V1 上线前确认当前附件存储后端是否可用。接口会写入一个小型诊断对象、
        读回并校验 sha256 摘要，然后尝试清理该诊断对象；不会登记业务附件，
        也不会暴露 access key、secret、authorization 或 session token。
        未配置对象存储时返回 ready=false 和缺失配置字段，方便部署预检。
      operationId: getAttachmentStorageDiagnostics
      responses:
        "200":
          description: 附件存储诊断结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentStorageDiagnosticsResponse"
        "403":
          $ref: "#/components/responses/BusinessError"

  /attachments/v1-readiness:
    get:
      tags: [Attachments]
      summary: 附件 V1 留档上线门禁
      description: >
        聚合附件对象存储诊断，判断当前附件留档是否达到 V1 上线条件。默认要求真实
        OSS/S3/COS 兼容对象存储；如果工厂现场明确批准本地文件存储作为 V1 留档方案，
        可通过服务端配置显式放行。接口只读，不登记业务附件，不输出密钥或 payload。
      operationId: getAttachmentV1Readiness
      responses:
        "200":
          description: 附件 V1 留档上线门禁结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentV1ReadinessResponse"
        "403":
          $ref: "#/components/responses/BusinessError"

  /attachments/{attachmentId}/access-url:
    get:
      tags: [Attachments]
      summary: 生成附件短期访问地址
      description: >
        在已有附件查看权限校验通过后，生成一个短期访问地址。P0 本地骨架返回
        API proxy URL 和过期 token；正式环境可替换为对象存储签名 URL。
      operationId: createAttachmentAccessUrl
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: ttlSeconds
          in: query
          schema:
            type: integer
            minimum: 60
            maximum: 3600
            default: 900
      responses:
        "200":
          description: 附件短期访问地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentAccessUrlResponse"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /attachments/{attachmentId}/access-logs:
    get:
      tags: [Attachments]
      summary: 查询附件访问审计
      description: >
        返回指定附件的访问地址签发和内容读取日志。P0 最小骨架默认写入本地 JSON 访问审计仓储；
        显式配置 PostgreSQL 时可写入 attachment_access_logs 表。
      operationId: listAttachmentAccessLogs
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 附件访问审计列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentAccessLogListResponse"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /attachments/{attachmentId}/content:
    get:
      tags: [Attachments]
      summary: 读取附件内容
      description: >
        当前最小骨架优先从本地文件读取附件内容，并兼容旧的内存 data URL；
        正式环境会替换为对象存储签名 URL 或文件流。直接读取需要附件查看权限；
        也可携带 access-url 接口生成的短期 accessToken / expiresAt。
      operationId: getAttachmentContent
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: accessToken
          in: query
          schema:
            type: string
        - name: expiresAt
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 附件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /todos:
    get:
      tags: [Todos]
      summary: 查询办公室公共待办
      description: >
        公共待办默认返回未处理事项，并按急单、异常、今天要发、最晚时间和
        等待时长排序。已处理和全部列表需要显式筛选。
      operationId: listTodos
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, handled, all]
            default: open
        - name: type
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [normal, urgent, exception, management_watch]
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 公共待办分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /todos/{todoId}/handle:
    post:
      tags: [Todos]
      summary: 处理、稍后提醒或重新打开待办
      description: >
        处理待办只记录待办处理结果和实际处理人。影响库存、金额、订单、
        交付状态的动作仍必须调用对应业务接口，不能只改待办状态。待办主状态、
        完整处理事件和操作日志在同一 PostgreSQL 幂等事务中提交；实际处理人以认证身份为准。
      operationId: handleTodo
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandleTodoRequest"
      responses:
        "200":
          description: 待办处理结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandleTodoResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /permissions/effective:
    get:
      tags: [Permissions]
      summary: 查询当前账号有效权限
      description: >
        返回当前登录账号的默认角色、额外授权和按钮级权限，用于前端显示 /
        隐藏动作按钮。后端仍必须在每个关键动作接口重复校验权限。
      operationId: getEffectivePermissions
      responses:
        "200":
          description: 当前账号有效权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectivePermissionsResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /operation-logs:
    get:
      tags: [Logs]
      summary: 查询关键操作日志
      description: >
        只记录影响金额、库存、生产、交付、责任和审计的关键动作。
        普通查看行为不进入主业务日志。
      operationId: listOperationLogs
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            type: string
        - name: targetId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 操作日志列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationLogListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /master-data/import-review-drafts:
    get:
      tags: [MasterData]
      summary: 查询基础资料导入确认草稿
      description: >
        返回 `MDI-*` 确认队列草稿。草稿可来自上传预检查，也可来自失败行
        修正再导入；该接口只读草稿，不写正式客户、价格、规格、库存、
        员工或机台资料。
      operationId: listMasterDataImportReviewDrafts
      parameters:
        - name: draftId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: sourceExecutionId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: 确认草稿分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataImportReviewDraftListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /master-data/import-confirmation-plans:
    get:
      tags: [MasterData]
      summary: 查询基础资料导入确认计划
      description: >
        返回已生成的基础资料导入确认计划。计划只表示导入前的审计 /
        事务保护方案，不代表已经写入正式客户、价格、规格、库存、员工或机台资料。
      operationId: listMasterDataImportConfirmationPlans
      parameters:
        - name: draftId
          in: query
          schema:
            type: string
        - name: planId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: 确认计划分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataImportConfirmationPlanListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [MasterData]
      summary: 生成基础资料导入确认计划
      description: >
        从无阻断的 `MDI-*` 确认队列草稿生成 `MDP-*` 导入确认计划，
        写入操作日志并持久化确认计划草稿。当前接口仍强制
        `officialImportEnabled=false` 和 `officialWriteScope=none`，
        不执行正式导入。
      operationId: createMasterDataImportConfirmationPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataImportConfirmationPlanRequest"
      responses:
        "201":
          description: 确认计划已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMasterDataImportConfirmationPlanResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

  /master-data/import-executions:
    get:
      tags: [MasterData]
      summary: 查询基础资料导入执行记录
      description: >
        返回从确认计划生成的 `MDE-*` 导入执行记录。默认请求只会记录
        权限、审计和阻断原因；管理账号显式确认正式导入且 writer 已配置时，
        可进入事务写入并返回 committed / failed 状态。
      operationId: listMasterDataImportExecutions
      parameters:
        - name: draftId
          in: query
          schema:
            type: string
        - name: planId
          in: query
          schema:
            type: string
        - name: executionId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: 执行记录分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataImportExecutionListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [MasterData]
      summary: 生成基础资料导入执行记录
      description: >
        管理账号从已保存的 `MDP-*` 确认计划生成 `MDE-*` 执行记录。
        默认不执行正式导入；只有请求显式传入 `officialImportEnabled=true`
        且 writer kind 为 `local_transaction` 或 `postgres` 时，才尝试在事务内
        写入客户、价格、规格、库存、员工和机台主数据。
      operationId: createMasterDataImportExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataImportExecutionRequest"
      responses:
        "201":
          description: 执行记录已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMasterDataImportExecutionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /master-data/import-executions/{executionId}/failed-rows:
    get:
      tags: [MasterData]
      summary: 下载基础资料导入失败行
      description: >
        下载 `MDE-*` 执行记录生成的失败行 CSV。没有失败行时返回业务错误；
        该接口用于办公室修正 Excel 后重新预检查和导入。
      operationId: downloadMasterDataImportFailedRows
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 失败行 CSV 文件
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"

  /master-data/import-executions/{executionId}/failed-rows/correction-draft:
    post:
      tags: [MasterData]
      summary: 从失败行生成基础资料修正草稿
      description: >
        从 `MDE-*` 执行记录的失败行生成新的 `MDI-*` 确认草稿，保留来源执行
        记录、失败原因和原始行数据。该接口不自动修正数据、不写正式主数据；
        后续仍需生成确认计划，并由有权限账号执行正式导入。
      operationId: createMasterDataFailedRowsCorrectionDraft
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataFailedRowsCorrectionDraftRequest"
      responses:
        "201":
          description: 修正草稿已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMasterDataFailedRowsCorrectionDraftResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /master-data/employee-account-reviews:
    get:
      tags: [MasterData]
      summary: 查询导入员工账号复核列表
      description: >
        返回正式导入后进入待管理员复核的员工账号资料。员工导入后默认不自动启用，
        管理账号需复核岗位、默认机台和推荐角色后再启用账号资料。
      operationId: listMasterDataEmployeeAccountReviews
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_admin_review, account_enabled]
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: 员工账号复核分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataEmployeeAccountReviewListResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /master-data/employee-account-reviews/{employeeId}/enable:
    post:
      tags: [MasterData]
      summary: 复核并启用导入员工账号
      description: >
        管理账号确认导入员工的岗位、默认机台和推荐角色后，把员工档案标记为
        `account_enabled`，生成内部用户投影并写入操作日志。该接口不代表已经完成
        正式密码发放或外部身份系统同步。
      operationId: enableMasterDataEmployeeAccount
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableMasterDataEmployeeAccountRequest"
      responses:
        "200":
          description: 员工账号已复核启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnableMasterDataEmployeeAccountResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"

  /master-data/employee-account-reviews/{employeeId}/password:
    post:
      tags: [MasterData]
      summary: 发放或重发导入员工临时密码
      description: >
        管理账号在导入员工账号已复核启用后生成临时密码，服务端只保存密码哈希，
        响应中的 `temporaryPassword` 仅本次可见；员工可用该登录名和临时密码进入
        动态账号登录会话。重发临时密码会让该员工旧 session 失效。
      operationId: issueMasterDataEmployeeAccountPassword
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMasterDataEmployeeAccountPasswordRequest"
      responses:
        "200":
          description: 临时密码已发放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMasterDataEmployeeAccountPasswordResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"

  /master-data/employee-account-reviews/{employeeId}/password/revoke:
    post:
      tags: [MasterData]
      summary: 撤销导入员工登录密码
      description: >
        管理账号撤销已导入员工的运行期登录密码。撤销后账号仍保留复核资料，
        但 `loginEnabled=false`，旧临时密码 / 已改密码无法继续登录，旧 session
        会被当前 API 进程拒绝。
      operationId: revokeMasterDataEmployeeAccountPassword
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeMasterDataEmployeeAccountPasswordRequest"
      responses:
        "200":
          description: 登录密码已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeMasterDataEmployeeAccountPasswordResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/BusinessError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-or-jwt

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 生产业务写入必填；同一请求重试必须复用相同键。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
      description: 订单草稿 ID
    OrderLineId:
      name: orderLineId
      in: path
      required: true
      schema:
        type: string
      description: 订单明细 ID
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
      description: 库存占用记录 ID
    CorrectionDraftId:
      name: correctionDraftId
      in: path
      required: true
      schema:
        type: string
      description: 库存修正草稿 ID
    RawMaterialInboundId:
      name: rawMaterialInboundId
      in: path
      required: true
      schema:
        type: string
      description: 原材料入库单 ID
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema:
        type: string
      description: 出库 / 交付任务 ID
    ProductionTaskId:
      name: productionTaskId
      in: path
      required: true
      schema:
        type: string
      description: 生产任务 ID
    PackingTaskId:
      name: packingTaskId
      in: path
      required: true
      schema:
        type: string
      description: 打包任务 ID
    StatementId:
      name: statementId
      in: path
      required: true
      schema:
        type: string
      description: 对账单 ID
    DownloadToken:
      name: downloadToken
      in: path
      required: true
      schema:
        type: string
      description: 预览接口返回的导出下载令牌
    PrintRecordId:
      name: printRecordId
      in: path
      required: true
      schema:
        type: string
      description: 打印记录 ID
    TodoId:
      name: todoId
      in: path
      required: true
      schema:
        type: string
      description: 公共待办 ID

  responses:
    AuthError:
      description: 未登录、登录失败或 token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessError:
      description: 业务规则不允许当前动作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: 当前账号缺少执行该动作的权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: 版本、状态或重复处理冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 请求的业务对象不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 字段缺失或格式不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    SystemPersistenceReadinessCriterion:
      type: object
      required: [key, label, status, tone, blocking, detail, evidence]
      properties:
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [passed, pending]
        tone:
          type: string
          enum: [success, warning, danger, neutral]
        blocking:
          type: boolean
        detail:
          type: string
        evidence:
          type: object
          additionalProperties: true

    SystemPersistenceReadinessSummary:
      type: object
      required: [label, passedCount, totalCount, blockingCount, tone]
      properties:
        label:
          type: string
        passedCount:
          type: integer
        totalCount:
          type: integer
        blockingCount:
          type: integer
        tone:
          type: string
          enum: [success, warning, danger, neutral]

    SystemPersistenceRepositorySummary:
      type: object
      required: [key, label, kind, productionReady, localKind]
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
          description: 运行时仓储类型，例如 postgres、object_storage、local_memory、local_json、local_fs 或 missing。
        productionReady:
          type: boolean
        localKind:
          type: boolean

    SystemPersistenceRepositoryGroupSummary:
      type: object
      required:
        - key
        - label
        - ready
        - acceptedByLocalPolicy
        - repositoryCount
        - productionReadyCount
        - localRepositoryCount
        - localMemoryCount
        - localJsonCount
        - localFsCount
        - repositories
      properties:
        key:
          type: string
        label:
          type: string
        ready:
          type: boolean
        acceptedByLocalPolicy:
          type: boolean
        repositoryCount:
          type: integer
        productionReadyCount:
          type: integer
        localRepositoryCount:
          type: integer
        localMemoryCount:
          type: integer
        localJsonCount:
          type: integer
        localFsCount:
          type: integer
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/SystemPersistenceRepositorySummary"

    SystemLocalPersistenceAcceptance:
      type: object
      required: [accepted, reference]
      properties:
        accepted:
          type: boolean
        reference:
          type: string

    SystemV1PersistenceProfileSummary:
      type: object
      required:
        - repositoryProfile
        - fileStorageProfile
        - postgresRepositoryDefaultsApplied
        - postgresRepositoryDefaultsSkipped
        - objectStorageDefaultsApplied
        - objectStorageDefaultsSkipped
        - databaseUrlConfigured
        - queryJsonConfigured
        - unsupportedRepositoryCount
        - unsupportedRepositories
        - connectionStringExposed
        - localPathExposed
        - secretFieldsExposed
      properties:
        repositoryProfile:
          type: string
          description: 脱敏后的仓储默认 profile，例如 disabled 或 postgres。
        fileStorageProfile:
          type: string
          description: 脱敏后的文件留档默认 profile，例如 disabled 或 object_storage。
        postgresRepositoryDefaultsApplied:
          type: integer
        postgresRepositoryDefaultsSkipped:
          type: integer
        objectStorageDefaultsApplied:
          type: integer
        objectStorageDefaultsSkipped:
          type: integer
        databaseUrlConfigured:
          type: boolean
          description: 只表示是否配置，不输出连接串。
        queryJsonConfigured:
          type: boolean
        unsupportedRepositoryCount:
          type: integer
        unsupportedRepositories:
          type: array
          items:
            type: string
        connectionStringExposed:
          type: boolean
          const: false
        localPathExposed:
          type: boolean
          const: false
        secretFieldsExposed:
          type: boolean
          const: false

    SystemPersistenceReadinessSafeguards:
      type: object
      required:
        - nonMutating
        - repositoryPayloadExposed
        - connectionStringExposed
        - localPathExposed
        - persistenceProfileConnectionStringExposed
        - persistenceProfileLocalPathExposed
        - persistenceProfileSecretFieldsExposed
        - requiresPostgresPersistence
        - localPersistenceAcceptedForV1
      properties:
        nonMutating:
          type: boolean
          const: true
        repositoryPayloadExposed:
          type: boolean
          const: false
        connectionStringExposed:
          type: boolean
          const: false
        localPathExposed:
          type: boolean
          const: false
        persistenceProfileConnectionStringExposed:
          type: boolean
          const: false
        persistenceProfileLocalPathExposed:
          type: boolean
          const: false
        persistenceProfileSecretFieldsExposed:
          type: boolean
          const: false
        requiresPostgresPersistence:
          type: boolean
        localPersistenceAcceptedForV1:
          type: boolean

    SystemV1PersistenceReadinessResponse:
      type: object
      required:
        - status
        - ready
        - checkedAt
        - operatorId
        - scope
        - summary
        - criteria
        - blockingCriteria
        - repositoryGroups
        - repositories
        - localPersistenceAcceptance
        - persistenceProfile
        - remainingV1Risks
        - safeguards
      properties:
        status:
          type: string
          enum: [ready, blocked]
        ready:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        operatorId:
          type: string
        scope:
          type: string
          enum: [v1_system_persistence_readiness]
        summary:
          $ref: "#/components/schemas/SystemPersistenceReadinessSummary"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/SystemPersistenceReadinessCriterion"
        blockingCriteria:
          type: array
          items:
            $ref: "#/components/schemas/SystemPersistenceReadinessCriterion"
        repositoryGroups:
          type: array
          items:
            $ref: "#/components/schemas/SystemPersistenceRepositoryGroupSummary"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/SystemPersistenceRepositorySummary"
        localPersistenceAcceptance:
          $ref: "#/components/schemas/SystemLocalPersistenceAcceptance"
        persistenceProfile:
          $ref: "#/components/schemas/SystemV1PersistenceProfileSummary"
        remainingV1Risks:
          type: array
          items:
            type: string
        safeguards:
          $ref: "#/components/schemas/SystemPersistenceReadinessSafeguards"

    SystemV1FieldEvidenceDraftManifestResponse:
      type: object
      required: [version, scope, status, ready, checkedAt, summary, invalidRows, nextAction, safeguards]
      properties:
        version:
          type: string
          enum: [p0-v1-field-evidence-intake-draft-v1]
        scope:
          type: string
          enum: [v1_field_evidence_intake_draft_manifest]
        status:
          type: string
          enum: [blocked_draft_written, ready_draft_written, invalid, error, blocked]
        ready:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        generatedAt:
          type: string
        operatorId:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        summary:
          type: object
          required:
            - appliedRowCount
            - appliedEvidenceRowCount
            - appliedSignoffRowCount
            - appliedBoundaryRowCount
            - skippedRowCount
            - invalidRowCount
            - evidenceProgress
            - signoffProgress
            - boundaryStatus
            - draftManifestStatus
            - releaseCandidateRefreshed
          properties:
            appliedRowCount:
              type: integer
            appliedEvidenceRowCount:
              type: integer
            appliedSignoffRowCount:
              type: integer
            appliedBoundaryRowCount:
              type: integer
            skippedRowCount:
              type: integer
            invalidRowCount:
              type: integer
            evidenceLabel:
              type: string
            evidenceProgress:
              type: string
              example: 0/34
            signoffProgress:
              type: string
              example: 0/6
            boundaryStatus:
              type: string
            draftManifestStatus:
              type: string
              enum: [available, not_written]
            inputSnapshot:
              type: object
              nullable: true
              description: 脱敏输入快照摘要，只含行数和布尔值，不含 CSV 原文、证据编号、签字人、路径或哈希值。
              properties:
                schema:
                  type: string
                  enum: [erp-v1-field-evidence-intake-snapshot-v1]
                evidenceCsvIncluded:
                  type: boolean
                evidenceRowCount:
                  type: integer
                signoffBoundaryCsvIncluded:
                  type: boolean
                signoffBoundaryRowCount:
                  type: integer
                rawCsvIncluded:
                  type: boolean
                digestValuesIncluded:
                  type: boolean
            releaseCandidateRefreshed:
              type: boolean
        validation:
          type: object
          properties:
            status:
              type: string
            ready:
              type: boolean
            label:
              type: string
        invalidRows:
          type: array
          items:
            type: object
            required: [type, row, reason, fixHint]
            properties:
              type:
                type: string
              row:
                type: integer
              groupKey:
                type: string
              itemKey:
                type: string
              reason:
                type: string
              fixHint:
                type: string
        invalidRowsShown:
          type: integer
        output:
          type: object
          required: [draftWritten, draftManifestStatus, sourceManifestMutated, releaseCandidateRefreshed]
          properties:
            draftWritten:
              type: boolean
            draftManifestStatus:
              type: string
              enum: [available, not_written]
            sourceManifestMutated:
              type: boolean
            releaseCandidateRefreshed:
              type: boolean
        nextAction:
          type: string
        safeguards:
