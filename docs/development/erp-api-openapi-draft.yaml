openapi: 3.1.0
info:
  title: ERP P0 Office API Draft
  version: 0.1.0
  description: >
    P0 办公室端高风险接口草案。当前用于评审订单确认、订单池查询、
    库存占用 / 修正、出库异常、打印、附件、操作日志和对账差额流程，
    不代表最终数据库结构。
servers:
  - url: /api
    description: 本地或同源 API
security:
  - bearerAuth: []
tags:
  - name: System
    description: 系统健康、上线门禁和运行时只读诊断
  - name: Authentication
    description: 登录、当前会话和退出
  - name: OrderDrafts
    description: 订单草稿识别、保存和确认
  - name: Orders
    description: 订单池查询、订单明细详情和追溯
  - name: Inventory
    description: 成品库存占用、释放和流水
  - name: RawMaterials
    description: 原材料送货单 OCR 预填、人工复核、一卷一标、贴标扫码和入库状态
  - name: Fulfillment
    description: 出库、交付和异常
  - name: Driver
    description: 司机手机端送货任务、装车、回单和异常
  - name: ProductionPacking
    description: 生产报工、合格入库占用、打包完成和包裹明细
  - name: Statements
    description: 对账、收款和差额处理
  - name: Print
    description: 单据、标签和重打 / 作废记录
  - name: Attachments
    description: 印刷图、成品图、付款截图和送货水印照片
  - name: MasterData
    description: 基础资料模板、预检查、确认队列和导入前计划
  - name: Todos
    description: 办公室公共待办、稍后提醒和处理记录
  - name: Permissions
    description: 当前账号角色、按钮权限和关键动作权限
  - name: Logs
    description: 关键业务操作日志

paths:
  /system/v1-readiness:
    get:
      tags: [System]
      summary: 查询 V1 系统核心持久化门禁
      description: >
        汇总订单、库存、出库、对账、生产、司机、附件、打印和主数据等核心仓储的运行时
        持久化模式，判断当前是否达到 V1 生产持久化要求。接口只读，只输出仓储类型和计数，
        不输出业务数据、连接串、本地文件路径或密钥。默认 local_memory / local_json / local_fs
        会阻塞 V1；如现场明确接受本地持久化作为 V1 方案，必须由服务端显式配置。
      operationId: getSystemV1Readiness
      responses:
        "200":
          description: V1 系统核心持久化门禁结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1PersistenceReadinessResponse"

  /system/v1-go-live-status:
    get:
      tags: [System]
      summary: 查询 V1 上线完成度汇总
      description: >
        只读汇总本地生成的 V1 完成度快照、go-live suite、最小解除阻塞清单和 V1/V2 差异摘要。
        该接口用于办公室 `上线状态` 页面展示当前是否可以宣布 V1 完成、分模块完成度、解除阻塞路径和计划 V2 差异。
        接口不修改现场证据、签字、发布门禁或任务状态，也不输出本地文件路径、env 值、命令值、密钥或原始 evidenceRef。
      operationId: getSystemV1GoLiveStatus
      responses:
        "200":
          description: V1 上线完成度和 V2 差异汇总
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1GoLiveStatusResponse"

  /system/v1-field-evidence-intake/draft-manifest:
    post:
      tags: [System]
      summary: 生成 V1 现场证据 manifest 草稿
      description: >
        从本地 V1 现场证据采集包中的 evidence-items.csv 和 signoff-boundary.csv 生成 draft manifest。
        该接口只写草稿文件，不修改源 manifest，不刷新 release candidate / go-live suite，不返回原始 CSV、证据编号、签字人、备注、草稿内容、产物路径或本地路径。
      operationId: generateSystemV1FieldEvidenceIntakeDraftManifest
      responses:
        "200":
          description: 草稿生成成功，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftManifestResponse"
        "400":
          description: 采集包或模板缺失 / 不可读
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftManifestResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: CSV 回填行无效，未写草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftManifestResponse"

  /system/v1-field-evidence-intake/stage-row:
    post:
      tags: [System]
      summary: 保存 V1 现场证据 / 签字草稿行
      description: >
        受控更新本地 V1 现场证据采集包 CSV 的单行 onsite 字段，并重新生成 draft manifest。
        该接口只写采集包 CSV 和草稿 manifest，不修改源 manifest，不刷新 release candidate / go-live suite，
        响应不返回原始证据编号、签字人、确认人、备注、CSV 内容、草稿内容、产物路径或本地路径。
      operationId: stageSystemV1FieldEvidenceIntakeRow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rowType, onsiteStatus]
              properties:
                rowType:
                  type: string
                  enum: [evidence, signoff, boundary]
                groupKey:
                  type: string
                itemKey:
                  type: string
                role:
                  type: string
                onsiteStatus:
                  type: string
                  enum: [pending, passed, accepted, blocked, not_applicable, signed, confirmed]
                onsiteEvidenceRef:
                  type: string
                onsiteSigner:
                  type: string
                onsiteSignedAt:
                  type: string
                onsiteConfirmedBy:
                  type: string
                onsiteConfirmedAt:
                  type: string
                onsiteNotes:
                  type: string
      responses:
        "200":
          description: 草稿行保存成功，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceStageRowResponse"
        "400":
          description: 采集包或模板缺失 / 不可读
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceStageRowResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 草稿行无效或 CSV 回填行无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceStageRowResponse"

  /system/v1-field-evidence-intake/validate-draft-manifest:
    post:
      tags: [System]
      summary: 校验 V1 现场证据 manifest 草稿
      description: >
        校验已生成的 V1 现场证据 draft manifest 是否满足现场证据、负责人签字和 V1/V2 边界要求。
        该接口只读，不修改草稿，不刷新 release candidate / go-live suite，不返回草稿内容、原始 evidenceRef、签字人、备注、产物路径或本地路径。
      operationId: validateSystemV1FieldEvidenceDraftManifest
      responses:
        "200":
          description: 草稿可读，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftValidationResponse"
        "400":
          description: 草稿缺失或不可读
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftValidationResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 草稿结构不符合 V1 现场证据 manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1FieldEvidenceDraftValidationResponse"

  /system/v1-production-env/live-precheck:
    post:
      tags: [System]
      summary: 当前运行环境 V1 生产 env 预检
      description: >
        只读检查当前 API 进程的生产 env 配置是否满足 V1 上线前置条件。
        该接口不接受前端传入 env 文件路径，不读取请求体中的 env 值，不刷新 release candidate / go-live suite，也不返回真实 env 值、命令值、密钥、env 文件路径、产物路径或原始预检报告。
      operationId: precheckSystemV1ProductionEnv
      responses:
        "200":
          description: 当前运行环境预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionEnvLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 预检脚本或运行环境不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionEnvLivePrecheckResponse"

  /system/v1-production-env-setup/live-run:
    post:
      tags: [System]
      summary: 当前 V1 生产 env 安全草稿 setup
      description: >
        由服务端运行 V1 生产 env 安全草稿准备器，用默认模板生成或复核安全未跟踪 env 草稿，并刷新脱敏 setup 报告。
        该接口忽略请求体，不接受前端传入目标 env 路径、导入路径或真实 env 值，不启用 force 覆盖，不执行真实值正式合并，不执行数据库迁移，不刷新 release candidate / go-live suite，不调用真实打印机，也不修改司机或业务数据。
        返回内容只包含脱敏后的 setup、审计、生产 env 预检摘要、剩余修正项和安全护栏；不返回目标 env 文件路径、env 值、连接串、bucket、secret、命令值、spool 路径、本地路径或原始命令输出。
      operationId: runSystemV1ProductionEnvSetup
      responses:
        "200":
          description: 当前生产 env 安全草稿 setup 已执行，可能为 prepared、blocked、ready 或 error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-env-intake/live-precheck:
    post:
      tags: [System]
      summary: 当前 V1 生产 env 真实值 intake 校验
      description: >
        只读复用服务端 production env setup latest 中已审计的安全 env 文件，并使用固定真实值 intake CSV 校验当前真实值补齐情况。
        该接口忽略请求体，不接受前端传入 env 文件路径、intake CSV 路径或 env 值，不写生产 env 文件，不执行真实值正式合并，不执行数据库迁移，不刷新 release candidate / go-live suite，不调用真实打印机，也不修改司机或业务数据。
        返回内容只包含脱敏后的清单进度、最小阻塞补值、阻塞项和安全护栏，不返回真实 env 文件路径、intake CSV 路径、env 值、连接串、bucket、secret、命令值、spool 路径或 token。
      operationId: precheckSystemV1ProductionEnvIntake
      responses:
        "200":
          description: 当前生产 env 真实值 intake 校验完成，可能为 not_configured、blocked 或 ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionEnvIntakeLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-env-file-audit/live-precheck:
    post:
      tags: [System]
      summary: 当前服务端 V1 生产 env 文件安全审计预检
      description: >
        只读审计当前 API 进程服务端配置的安全 env 文件路径，用于检查真实 env 文件是否未被 git 跟踪、未直接使用模板、没有未替换占位值等。
        该接口忽略请求体，不接受前端传入 env 文件路径，不返回真实 env 值、env 文件路径、原始行内容、注释、命令值、连接串或密钥，也不刷新 release candidate / go-live suite。
      operationId: precheckSystemV1ProductionEnvFileAudit
      responses:
        "200":
          description: 当前服务端 env 文件安全审计预检完成，可能为 not_configured 或 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionEnvFileAuditLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-env-file-preview/live-precheck:
    post:
      tags: [System]
      summary: 当前服务端 V1 生产 env 文件应用预检
      description: >
        只读读取当前 API 进程服务端配置的安全 env 文件，先执行 env 文件安全审计，审计通过后把文件 KEY=VALUE 叠加到当前运行环境的内存副本里执行 V1 生产 env 预检。
        该接口忽略请求体，不接受前端传入 env 文件路径或 env 值，不改写 process.env，不返回真实 env 文件路径、env 值、命令值、连接串、密钥或原始预检报告，也不刷新 release candidate / go-live suite。
      operationId: precheckSystemV1ProductionEnvFilePreview
      responses:
        "200":
          description: 当前服务端 env 文件应用预检完成，可能为 not_configured、audit_blocked 或 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionEnvFilePreviewLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-go-live/live-precheck:
    post:
      tags: [System]
      summary: 当前 V1 生产上线组合预检
      description: >
        只读组合执行当前 API 进程的服务端 env 文件安全审计、env 文件内存应用预检、运行时 V1 readiness 和生产上线配置总门禁。
        该接口忽略请求体，不接受前端传入 env 文件路径或 env 值，不改写 process.env，不刷新 release candidate / go-live suite，不调用真实打印机，
        也不返回真实 env 文件路径、env 值、命令值、连接串、密钥、本地路径或原始预检报告。
      operationId: precheckSystemV1ProductionGoLive
      responses:
        "200":
          description: 当前生产上线组合预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionGoLiveLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 组合预检脚本或当前 readiness 端点不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ProductionGoLiveLivePrecheckResponse"

  /system/v1-production-persistence-evidence/live-run:
    post:
      tags: [System]
      summary: 当前 V1 生产持久化留证
      description: >
        从当前 API 进程服务端 production env setup latest 读取安全生产 env 文件，并执行生产持久化首阶段留证 runner。
        该接口忽略请求体，不接受前端传入 env 文件路径、真实值片段路径、API 地址或 env 值；默认不执行数据库迁移 apply，不允许恢复验证库重置，不刷新 release candidate / go-live suite，不调用真实打印机，也不修改司机或业务数据。
        返回内容只包含脱敏后的 env 文件安全、生产持久化 env 子集、迁移计划、PostgreSQL 预检、PostgreSQL 备份 / 恢复抽样、对象存储 live 预检、bucket 治理检查、阻塞项和安全护栏；不返回 stdout/stderr、真实路径、env 值、连接串、endpoint、bucket、secret、对象 key、签名 URL、命令值、spool 路径、bucket policy 或 token。
      operationId: runSystemV1ProductionPersistenceEvidence
      responses:
        "200":
          description: 当前生产持久化留证完成，可能仍为 blocked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-first-stage-execution/live-run:
    post:
      tags: [System]
      summary: 当前 V1 生产环境 / 持久化第一阶段执行
      description: >
        从当前 API 进程服务端 production env setup latest 读取安全生产 env 文件，并执行第一阶段生产环境 / 持久化 runner。
        该接口忽略请求体，不接受前端传入 env 文件路径、真实值片段路径、API 地址或 env 值；默认不执行数据库迁移 apply，不允许恢复验证库重置，不执行真实值片段正式合并，不刷新 release candidate / go-live suite，不调用真实打印机，也不修改司机或业务数据。
        runtime smoke 使用当前请求推导出的 API 地址做服务端内部探针，但不接受或返回浏览器传入的 API base URL。
        返回内容只包含脱敏后的步骤进度、阻塞项和安全护栏，不返回 stdout/stderr、真实路径、env 值、连接串、bucket、secret、命令值、spool 路径、API 地址或 token。
      operationId: runSystemV1ProductionFirstStageExecution
      responses:
        "200":
          description: 当前第一阶段执行完成，可能仍为 blocked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-first-stage-values-dry-run/live-precheck:
    post:
      tags: [System]
      summary: 当前 V1 生产环境 / 持久化第一阶段真实值片段 dry-run 预检
      description: >
        从当前 API 进程服务端配置的安全真实值片段执行第一阶段 values dry-run，用于确认真实值片段是否能按 intake 白名单覆盖最小阻塞补值。
        dry-run 还要求 production env setup latest 中的目标安全 env 文件已 ready；如果真实值片段已配置但目标 setup 未就绪，接口返回 target_not_ready，且不会调用第一阶段执行器。
        响应会脱敏返回本次 dry-run 可作为正式合并前置证明的状态、最小阻塞补值覆盖和缺项数，供办公室判断能否进入正式合并门禁。
        该接口忽略请求体，不接受前端传入真实值片段路径或 env 值，不返回真实片段路径、目标 env 文件路径、env 值、连接串、bucket、secret、命令值、spool 路径、本地路径或原始命令输出。
        dry-run 不写目标生产 env，不执行迁移 apply，不刷新 release candidate / go-live suite，不调用真实打印机，也不修改业务数据。
      operationId: precheckSystemV1ProductionFirstStageValuesDryRun
      responses:
        "200":
          description: 当前第一阶段真实值片段 dry-run 预检完成，可能为 not_configured、target_not_ready、blocked 或 ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-production-first-stage-values-apply/live-run:
    post:
      tags: [System]
      summary: 当前 V1 生产环境 / 持久化第一阶段真实值正式合并
      description: >
        从当前 API 进程服务端配置的安全真实值片段执行 production env intake 白名单正式合并。
        该接口默认由 ERP_V1_PRODUCTION_ENV_VALUES_APPLY_ENABLED 关闭；未显式启用时只返回 disabled，不写目标 env。
        启用后仍只读取服务端配置的真实值片段路径，不接受前端传入路径或 env 值；只写 production env setup 的目标安全 env 草稿，并刷新 setup / intake verify。
        该接口不执行数据库迁移 apply，不刷新 release candidate / go-live suite，不调用真实打印机，不修改司机或业务数据，也不返回真实片段路径、目标 env 文件路径、env 值、连接串、bucket、secret、命令值、spool 路径、本地路径或原始命令输出。
      operationId: runSystemV1ProductionFirstStageValuesApply
      responses:
        "200":
          description: 当前第一阶段真实值正式合并处理完成，可能为 disabled、not_configured、target_not_ready、blocked、applied_with_remaining_blockers 或 ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-runtime-readiness/live-precheck:
    post:
      tags: [System]
      summary: 当前运行时 V1 总门禁预检
      description: >
        只读读取当前 API 实例的 11 项 V1 runtime readiness：健康检查、OpenAPI、系统持久化、操作账号权限、司机验收账号权限、附件对象存储、附件 V1 留档、打印 spool、CUPS 队列、打印 V1 门禁和司机端真机门禁。
        该接口忽略请求体，不接受前端传入 API base URL 或 bearer token，不刷新 release candidate / go-live suite，也不返回 URL、token、env 值、命令值、spool 路径、本地路径、业务 payload 或原始 readiness 报告。
      operationId: precheckSystemV1RuntimeReadiness
      responses:
        "200":
          description: 当前运行时总门禁预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1RuntimeReadinessLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: readiness 端点或运行环境不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1RuntimeReadinessLivePrecheckResponse"

  /system/v1-persistence/live-precheck:
    post:
      tags: [System]
      summary: 当前系统 V1 持久化预检
      description: >
        只读读取当前 API 实例的系统 V1 持久化门禁，按业务分组展示 PostgreSQL / 对象存储和本地 / 内存仓储数量。
        该接口忽略请求体，不刷新 release candidate / go-live suite，不返回业务数据、连接串、本地路径、env 值、命令值、密钥或原始 readiness 报告。
      operationId: precheckSystemV1Persistence
      responses:
        "200":
          description: 当前系统持久化预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1PersistenceLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 系统持久化 readiness 不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1PersistenceLivePrecheckResponse"

  /system/v1-attachment-retention/live-precheck:
    post:
      tags: [System]
      summary: 当前附件 V1 留档预检
      description: >
        只读读取当前 API 实例的附件 V1 留档门禁，复用附件存储诊断并返回脱敏汇总。
        该接口忽略请求体，不登记业务附件，不刷新 release candidate / go-live suite，
        不返回诊断对象 ID、storage key、摘要值、本地路径、env 值、命令值、密钥或原始附件 readiness 报告。
      operationId: precheckSystemV1AttachmentRetention
      responses:
        "200":
          description: 当前附件 V1 留档预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1AttachmentRetentionLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 附件 V1 留档 readiness 不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1AttachmentRetentionLivePrecheckResponse"

  /system/v1-driver-readiness/live-precheck:
    post:
      tags: [System]
      summary: 当前司机端 V1 真机门禁预检
      description: >
        只读读取当前 API 实例的司机端 V1 真机门禁，使用服务端配置的司机验收账号口径检查送货任务读取、现场验收记录、原生扫码、原生导航和纸质包裹标签扫码样本。
        该接口忽略请求体，不修改送货任务，不调用摄像头、扫码 SDK、原生导航或原生桥，不刷新 release candidate / go-live suite，
        也不返回原始送货任务、原始现场验收记录、扫码文本、照片、水印位置、原生 payload、本地路径或密钥。
      operationId: precheckSystemV1DriverReadiness
      responses:
        "200":
          description: 当前司机端 V1 真机门禁预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1DriverReadinessLivePrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 司机端 V1 readiness 不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1DriverReadinessLivePrecheckResponse"

  /system/v1-v2-boundary/precheck:
    post:
      tags: [System]
      summary: V1/V2 边界确认预检
      description: >
        只读读取当前 V1/V2 差异摘要和签字/边界 CSV，判断负责人是否已经确认
        V1 必做项不能后移到 V2，以及 V2 延后项是否只作为后续计划说明。
        该接口忽略请求体，不写入确认人或确认时间，不刷新 release candidate / go-live suite，
        也不返回原始证据、签字人、备注、产物路径、本地路径、env 值、命令值或密钥。
      operationId: precheckSystemV1V2Boundary
      responses:
        "200":
          description: V1/V2 边界预检完成，可能仍为 pending_confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1V2BoundaryPrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-v2-scope-brief/refresh:
    post:
      tags: [System]
      summary: 刷新 V1/V2 差异摘要
      description: >
        受控重新生成当前 V1/V2 差异摘要，使页面展示的 V1 必做项、计划 V2 差异和负责人复核规则
        与当前完成度快照保持同步。该接口忽略请求体，只刷新差异摘要产物，不写入边界确认人或确认时间，
        不刷新 release candidate / go-live suite，不修改现场证据、签字、生产 env、打印、司机或业务数据，
        也不返回原始 Markdown、产物路径、本地路径、env 值、命令值、stdout/stderr 或密钥。
      operationId: refreshSystemV1V2ScopeBrief
      responses:
        "200":
          description: V1/V2 差异摘要已刷新，V1 可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1V2ScopeBriefRefreshResponse"
        "500":
          description: 刷新命令失败，响应仍保持脱敏
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1V2ScopeBriefRefreshResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-release-candidate/refresh-precheck:
    post:
      tags: [System]
      summary: V1 release candidate 刷新前置预检
      description: >
        聚合现场证据草稿校验、生产 env 门禁、当前生产上线组合门禁、负责人签字和 V1/V2 边界状态，判断当前是否具备刷新 release candidate / go-live suite 的条件。
        该接口只读，不刷新 release candidate / go-live suite，不修改现场证据草稿，不改写当前 process.env，不返回原始证据、签字人、备注、env 值、命令值、产物路径、本地路径或生产组合预检原始报告。
      operationId: precheckSystemV1ReleaseCandidateRefresh
      responses:
        "200":
          description: 预检完成，可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ReleaseCandidateRefreshPrecheckResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/v1-release-candidate/refresh:
    post:
      tags: [System]
      summary: 受控刷新 V1 release candidate / go-live suite
      description: >
        仅在刷新前置预检 ready 时，由服务端使用当前现场证据草稿、服务端配置的安全 env 文件和当前 API 地址刷新 release candidate / go-live suite。
        请求体会被忽略，前端不能传入 env 路径、token 或命令参数。未满足条件时返回 409 和脱敏阻塞项，不执行刷新命令。
      operationId: refreshSystemV1ReleaseCandidate
      responses:
        "200":
          description: 刷新动作已执行，结果可能仍为 blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ReleaseCandidateRefreshResponse"
        "409":
          description: 前置预检未 ready，未执行刷新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ReleaseCandidateRefreshResponse"
        "500":
          description: 服务端刷新命令失败，命令输出不返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemV1ReleaseCandidateRefreshResponse"
        "403":
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Seed 登录并生成会话 token
      description: >
        当前用于后端骨架和本地开发验证。真实系统应替换为数据库账号、
        密码策略、会话存储、撤销和审计日志。
      operationId: loginSeedSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: 登录成功，返回 bearer token 和当前账号权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "423":
          $ref: "#/components/responses/AuthError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/prototype-login:
    post:
      tags: [Authentication]
      security: []
      summary: 本地原型用户切换
      description: >
        仅限非严格本地原型模式。浏览器仅提交 seed 用户 ID，不包含密码；
        严格生产认证模式始终拒绝该端点。
      operationId: loginPrototypeSeedSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrototypeSeedLoginRequest"
      responses:
        "200":
          description: 本地原型会话已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: 导入员工首次登录后修改临时密码
      description: >
        仅支持已发放临时密码的导入员工运行期账号。账号处于
        `mustChangePassword=true` 时，登录和会话查询仍会返回用户身份，
        但业务 action/button 权限为空；改密成功后才恢复角色权限。
      operationId: changeRuntimeEmployeePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordRequest"
      responses:
        "200":
          description: 密码已修改，临时密码状态已清除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChangePasswordResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      tags: [Authentication]
      summary: 查询当前登录会话
      description: >
        使用 `Authorization: Bearer <token>` 查询当前账号和有效权限。
        这是前端初始化当前账号、角色和按钮权限的登录态入口。
      operationId: getCurrentSession
      responses:
        "200":
          description: 当前登录会话和权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCurrentSessionResponse"
        "401":
          $ref: "#/components/responses/AuthError"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: 退出当前会话
      description: >
        P0 seed token 仍是本地签名 token，但当前 API 进程会记录本次 session jti
        的吊销状态；后续生产登录仍需要持久化会话表或 token 黑名单。
      operationId: logoutSeedSession
      responses:
        "200":
          description: 退出处理结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"

  /order-drafts/recognize:
    post:
      tags: [OrderDrafts]
      summary: 识别客户原文并生成订单草稿
      description: >
        用于订单录入页的整段粘贴或手工输入识别。识别结果只能作为草稿，
        库存、价格和风险提示都是快照，正式订单仍必须走确认接口重校验。
      operationId: recognizeOrderDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognizeOrderDraftRequest"
      responses:
        "200":
          description: 识别完成，返回草稿和可编辑明细
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDraftRecognitionResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /order-drafts/{draftId}:
    patch:
      tags: [OrderDrafts]
      summary: 保存订单草稿编辑结果
      description: >
        保存人工修正后的草稿。保存草稿不生成正式订单、不占用库存，
        但会记录草稿版本，必要时生成待补充信息待办。
      operationId: saveOrderDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveOrderDraftRequest"
      responses:
        "200":
          description: 草稿已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveOrderDraftResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /order-drafts/{draftId}/confirm:
    post:
      tags: [OrderDrafts]
      summary: 确认订单草稿并生成正式订单
      description: >
        正式生成订单前必须重新校验库存、价格和订单类型必填字段。
        识别时库存 / 价格只作为快照，不能直接变成正式承诺。
      operationId: confirmOrderDraft
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOrderDraftRequest"
      responses:
        "200":
          description: 订单确认成功，可能包含正式明细、库存占用、出库任务和待办
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmOrderDraftResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /order-lines:
    get:
      tags: [Orders]
      summary: 查询订单池明细列表
      description: >
        默认用于办公室订单池。按订单明细行查询，默认范围是近 30 天未完成
        加今日完成；历史全量查询必须显式打开。
      operationId: listOrderLines
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: orderType
          in: query
          schema:
            type: string
            enum: [stock, custom_print, external_print, replenishment]
        - name: fulfillmentMethod
          in: query
          schema:
            $ref: "#/components/schemas/FulfillmentMethod"
        - name: exceptionOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: financeState
          in: query
          schema:
            type: string
            enum: [unbilled, pending_statement, sent, variance, debt, settled]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: includeHistory
          in: query
          schema:
            type: boolean
            default: false
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 订单池分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLineListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /order-lines/{orderLineId}:
    get:
      tags: [Orders]
      summary: 查询订单明细详情
      description: >
        返回订单池右侧详情需要的数据，包括原始订单、生产、库存、出库、
        对账、附件和操作日志摘要。正式详情页可复用同一接口扩展。
      operationId: getOrderLineDetail
      parameters:
        - $ref: "#/components/parameters/OrderLineId"
      responses:
        "200":
          description: 订单明细详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLineDetailResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"

  /order-lines/{orderLineId}/void:
    post:
      tags: [Orders]
      summary: 作废未生产正式订单明细
      description: >
        只允许未生产、未交付、未关闭的订单明细直接作废。作废时关闭订单明细、
        取消对应未交付出库任务，释放该明细仍生效的库存占用，并写订单变更记录、
        库存释放流水和操作日志。
      operationId: voidOrderLine
      parameters:
        - $ref: "#/components/parameters/OrderLineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidOrderLineRequest"
      responses:
        "200":
          description: 订单明细已作废
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidOrderLineResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /order-lines/{orderLineId}/quantity-adjustment:
    post:
      tags: [Orders]
      summary: 调整未生产正式订单明细数量
      description: >
        只允许未生产、未交付、未关闭的正式订单明细直接改量。减量时释放多余库存占用，
        增量时必须存在生效占用并重新检查可用库存后补占用，同时同步未交付出库任务数量、
        写订单变更记录、库存流水和操作日志。
      operationId: adjustOrderLineQuantity
      parameters:
        - $ref: "#/components/parameters/OrderLineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustOrderLineQuantityRequest"
      responses:
        "200":
          description: 订单明细数量已调整
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustOrderLineQuantityResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "403":
          $ref: "#/components/responses/BusinessError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inventory/items:
    get:
      tags: [Inventory]
      summary: 查询成品库存项
      description: >
        库存查询页列表和缺货判断使用。可用量按在库 - 占用 - 待提货锁定 -
        待处理 / 报废计算，待处理库存默认不作为正常可用库存。
      operationId: listInventoryItems
      parameters:
        - name: size
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: handleType
          in: query
          schema:
            type: string
        - name: style
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [available, reserved, waiting_pickup_locked, pending_handling, pending_scrap, all]
        - name: trustLevel
          in: query
          schema:
            type: string
            enum: [counted, workshop_reported, estimated, pending_review, all]
        - name: keyword
          in: query
          schema:
            type: string
        - name: includePending
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 成品库存项分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemListResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inventory/ledger-entries:
