<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC 全流程设计 QA 对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #eef2f6; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      h1 { margin: 0 0 18px; font-size: 22px; }
      section { margin-bottom: 22px; }
      h2 { margin: 0 0 8px; font-size: 15px; }
      .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #cfd8e3; border-radius: 8px; background: white; }
      figcaption { padding: 8px 10px; border-bottom: 1px solid #dfe5ec; color: #526177; font-size: 12px; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <h1>PC 全流程设计 QA 对照 · 1280×720</h1>
    <section>
      <h2>订单录入</h2>
      <div class="pair"><figure><figcaption>视觉来源</figcaption><img src="./reference-order-entry-1280x720.png" /></figure><figure><figcaption>当前实现</figcaption><img src="./pc-full-flow-order-entry-1280x720.png" /></figure></div>
    </section>
    <section>
      <h2>生产 / 打包 / 打印</h2>
      <div class="pair"><figure><figcaption>视觉来源</figcaption><img src="./reference-production-1280x720.png" /></figure><figure><figcaption>当前实现</figcaption><img src="./pc-full-flow-production-1280x720.png" /></figure></div>
    </section>
    <section>
      <h2>库存查询</h2>

    </section>
    <section>
      <h2>出库交付</h2>

    </section>
    <section>
      <h2>对账收款</h2>
      <div class="pair"><figure><figcaption>视觉来源</figcaption><img src="./reference-statements-1280x720.png" /></figure><figure><figcaption>当前实现</figcaption><img src="./pc-full-flow-statements-1280x720.png" /></figure></div>
    </section>
  </body>
</html>
