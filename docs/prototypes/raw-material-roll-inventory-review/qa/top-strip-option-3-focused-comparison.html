<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原材料顶栏方案 3 局部对照</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #111820; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { width: 2636px; display: grid; grid-template-columns: 1300px 1300px; gap: 12px; padding: 12px; }
      figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid #334155; background: #fff; }
      figcaption { height: 38px; display: flex; align-items: center; padding: 0 12px; background: #18222d; color: #e2e8f0; font-size: 14px; font-weight: 650; }
      .crop { position: relative; width: 1300px; height: 160px; overflow: hidden; background: #f3f6f9; }
      img { position: absolute; top: -64px; left: -188px; display: block; width: 1488px; height: 767px; max-width: none; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>左：方案 3 顶栏与库存摘要</figcaption>
        <div class="crop"><img src="./top-strip-option-3-source-1488x767.png" alt="方案 3 局部" /></div>
      </figure>
      <figure>
        <figcaption>右：实装顶栏与库存摘要</figcaption>
        <div class="crop"><img src="./top-strip-option-3-implementation-1488x767.png" alt="实装局部" /></div>
      </figure>
    </main>
  </body>
</html>
