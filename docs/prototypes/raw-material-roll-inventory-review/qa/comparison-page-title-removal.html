<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面标题删除批注 QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #101c25; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      figure { width: 100%; margin: 0; border-bottom: 8px solid #101c25; background: white; }
      figcaption { min-height: 38px; display: flex; align-items: center; padding: 0 12px; background: #192934; color: #f5f7f9; font-size: 13px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>修改前：主内容重复显示“原材料”标题</figcaption>
      <img alt="修改前原材料页面标题" src="./account-permission-navigation-browser.png" />
    </figure>
    <figure>
      <figcaption>修改后：移除标题，刷新与工作台内容保持原位</figcaption>
      <img alt="修改后移除原材料页面标题" src="./page-title-removed-browser.png" />
    </figure>
  </body>
</html>
