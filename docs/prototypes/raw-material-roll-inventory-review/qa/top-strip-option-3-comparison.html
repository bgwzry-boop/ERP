<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原材料顶栏方案 3 全页对照</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #111820; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { width: 3000px; display: grid; grid-template-columns: 1488px 1488px; gap: 12px; padding: 12px; }
      figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid #334155; background: #fff; }
      figcaption { height: 38px; display: flex; align-items: center; padding: 0 12px; background: #18222d; color: #e2e8f0; font-size: 14px; font-weight: 650; }
      img { display: block; width: 1488px; height: 767px; object-fit: fill; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>左：选定的方案 3 效果图</figcaption>
        <img src="./top-strip-option-3-source-1488x767.png" alt="选定方案 3" />
      </figure>
      <figure>
        <figcaption>右：浏览器实装</figcaption>
        <img src="./top-strip-option-3-implementation-1488x767.png" alt="浏览器实装" />
      </figure>
    </main>
  </body>
</html>
