<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账号权限导航批注 QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #101c25; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      figure { width: 100%; margin: 0; border-bottom: 8px solid #101c25; background: white; }
      figcaption { min-height: 38px; display: flex; align-items: center; padding: 0 12px; background: #192934; color: #f5f7f9; font-size: 13px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>修改前：左侧岗位框与右上账号重复</figcaption>
      <img alt="修改前重复岗位框" src="./account-switcher-before-browser.png" />
    </figure>
    <figure>
      <figcaption>修改后：右上账号是唯一身份来源，左栏按权限过滤</figcaption>
      <img alt="修改后账号权限导航" src="./account-permission-navigation-browser.png" />
    </figure>
  </body>
</html>
