name: UI screenshots

# 每个 PR 给主要页面截图：PR 分支和目标分支各一套，打包成 artifact，方便对比界面改动。
on:
  pull_request:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture PR branch
        run: |
          setsid npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/head-vite.log 2>&1 &
          for i in {1..60}; do curl -fs http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node scripts/capture-ui-screenshots.mjs ui-shots/head http://127.0.0.1:5173/
          pkill -f "vite --host 127.0.0.1 --port 5173" || true
      - name: Capture base branch
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          cd /tmp/base
          npm ci
          setsid npx vite --host 127.0.0.1 --port 5174 --strictPort > /tmp/base-vite.log 2>&1 &
          for i in {1..60}; do curl -fs http://127.0.0.1:5174/ >/dev/null && break; sleep 1; done
          node "$GITHUB_WORKSPACE/scripts/capture-ui-screenshots.mjs" "$GITHUB_WORKSPACE/ui-shots/base" http://127.0.0.1:5174/
          pkill -f "vite --host 127.0.0.1 --port 5174" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ github.event.pull_request.number }}
          path: |
            ui-shots/
            /tmp/head-vite.log
            /tmp/base-vite.log
          retention-days: 14
